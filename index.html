<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18181B">
<meta name="robots" content="noindex, nofollow">
<title>Minha Vida Financeira</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  html{ background:#18181B; }
  img{ max-width:100%; }
  [hidden]:not([hidden=until-found i]){ display:none !important; }
  :root{
    color-scheme: dark;
    --bg: #18181B;
    --bg-rgb: 24,24,27;
    --bg-panel: #202023;
    --bg-card: #212124;
    --bg-card2: #28282C;
    --line: #38383E;
    --ink: #F2F2F3;
    --ink-dim: #A6A6AD;
    --ink-faint: #717178;
    --invert-rgb: 10,10,11;
    --gold: #5B96F5;
    --gold-dim: #1C2A42;
    --rust: #F0916E;
    --rust-dim: #3A2A20;
    --navy: #A3B2FF;
    --navy-dim: #242A42;
    --teal: #4FD6C5;
    --teal-dim: #16322F;
    --amber: #E8BE6E;
    --amber-dim: #362C19;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.4);
    --shadow-md: 0 14px 34px rgba(0,0,0,0.5);
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans',sans-serif;
    overscroll-behavior-y: none;
  }
  svg.icon{ width:1em; height:1em; display:inline-block; vertical-align:-0.125em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .app{
    max-width: 560px;
    margin: 0 auto;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ---------- HEADER ---------- */
  .topbar{
    position: sticky; top:0; z-index: 20;
    background: rgba(var(--bg-rgb),0.9);
    backdrop-filter: blur(14px);
    padding: calc(14px + var(--safe-top)) 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .topbar h1{
    font-family:'Fraunces',Georgia,serif; font-weight:700; font-size: 19px; margin:0;
    letter-spacing: -0.02em; color: var(--ink); text-align:center;
  }
  .topbar h1 .dot{ color: var(--gold); }
  .month-picker{
    display:flex; align-items:center; gap:8px; margin-top:12px;
  }
  .month-picker button.hoje{
    width:auto; padding:0 13px; font-family:'Work Sans',sans-serif; font-size:12px; font-weight:600; color:var(--gold);
  }
  .month-picker button{
    background: var(--bg-card2); border:1px solid transparent; color: var(--ink-dim);
    width: 38px; height:38px; border-radius:12px; font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    transition: background .12s;
  }
  .month-picker button:hover{ background: var(--line); color:var(--ink); }
  .month-picker select{
    flex:1;
    background: rgb(var(--invert-rgb)); border:none; color: #fff;
    font-family:'IBM Plex Mono', monospace; font-size:14.5px; font-weight:600;
    padding: 10px 12px; border-radius:12px; text-align:center;
    box-shadow: var(--shadow-sm);
  }

  /* ---------- CONTENT ---------- */
  .content{
    flex:1;
    padding: 14px 16px calc(90px + var(--safe-bottom));
    overflow-y: auto;
  }
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---------- BOTTOM NAV (mobile) — flutuante ---------- */
  .bottomnav{
    position: fixed; left:12px; right:12px; bottom:12px; z-index: 30;
    max-width: 536px; margin: 0 auto;
    background: rgba(var(--invert-rgb),0.94);
    backdrop-filter: blur(16px);
    border-top: none;
    border-radius: 20px;
    box-shadow: var(--shadow-md);
    display:flex;
    padding: 4px;
    padding-bottom: calc(4px + var(--safe-bottom));
  }
  .navbtn{
    flex:1; background:none; border:none; color: rgba(255,255,255,0.55);
    padding: 10px 4px; border-radius:16px; display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer; font-family:'Work Sans',sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.01em; transition: background .12s, color .12s;
  }
  .navbtn .nicon{ font-size:19px; line-height:1; }
  .navbtn.active{ color: #fff; background: rgba(255,255,255,0.12); }
  .navbtn.active .nicon{ color: var(--gold); }

  /* ---------- RESUMO DO TOPO (saldo + andamento do mês) ---------- */
  .badges{ display:grid; grid-template-columns: repeat(2, 1fr); gap:9px; margin-bottom:16px; }
  .hero{
    background: rgb(var(--invert-rgb)); border-radius: var(--r-lg); padding:18px; margin-bottom:14px;
    box-shadow: var(--shadow-md); display:grid; gap:16px;
  }
  .hero-main{ min-width:0; }
  .hero-label{ font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:rgba(255,255,255,0.55); margin-bottom:4px; }
  .hero-val{ font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:700; color:#fff; white-space:nowrap; letter-spacing:-0.02em; line-height:1.15; }
  .hero-val.neg{ color:#ff9c9c; }
  .hero-sub{ font-size:11.5px; color:rgba(255,255,255,0.5); margin-top:5px; line-height:1.5; }
  .hero-sub b{ color:rgba(255,255,255,0.9); font-weight:600; font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
  .hero-meters{ display:grid; gap:13px; align-content:center; min-width:0; }
  .meter-top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:12px; color:rgba(255,255,255,0.6); }
  .meter-top b{ font-family:'IBM Plex Mono',monospace; color:#fff; font-weight:600; font-size:12.5px; white-space:nowrap; }
  .meter-top .de{ font-family:'IBM Plex Mono',monospace; font-size:11px; white-space:nowrap; }
  .meter-bar{ height:6px; border-radius:99px; background:rgba(255,255,255,0.1); margin:6px 0 4px; overflow:hidden; }
  .meter-bar i{ display:block; height:100%; border-radius:99px; }
  .meter.rec .meter-bar i{ background:var(--gold); }
  .meter.pag .meter-bar i{ background:var(--rust); }
  .meter-falta{ font-size:10.5px; color:rgba(255,255,255,0.45); }
  .hero-invest{
    background:none; border:none; border-top:1px solid rgba(255,255,255,0.12); padding:14px 0 0; margin:0;
    text-align:left; cursor:pointer; color:inherit; font:inherit;
    display:grid; grid-template-columns:1fr auto; align-items:center; column-gap:12px;
  }
  .hero-invest .hero-label{ margin:0 0 2px; grid-column:1; }
  .hero-invest .hi-val{ grid-column:1; font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:700; color:#fff; white-space:nowrap; }
  .hero-invest .hi-sub{ grid-column:2; grid-row:1 / span 2; font-size:11.5px; font-weight:600; color:var(--gold); white-space:nowrap; }
  .conta{ display:grid; align-content:center; min-width:0; }
  .conta-l{
    display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:7px 0;
    font-size:12.5px; color:rgba(255,255,255,0.65); border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .conta-l small{ display:block; font-size:10.5px; color:rgba(255,255,255,0.4); margin-top:1px; }
  .conta-l b{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:13px; color:#fff; white-space:nowrap; }
  .conta-l b.pos{ color:var(--teal); }
  .conta-l b.neg{ color:#ff9c9c; }
  .conta-l.total{ border-bottom:none; border-top:1px solid rgba(255,255,255,0.28); margin-top:-1px; padding-top:9px; color:#fff; font-weight:600; }
  @media (min-width: 880px){
    .hero{ grid-template-columns: minmax(0,1fr) minmax(0,1.3fr); gap:40px; align-items:center; padding:24px 28px; }
    .hero.com-invest{ grid-template-columns: minmax(0,1fr) minmax(0,1.3fr) auto; }
    .hero-val{ font-size:32px; }
    .hero-invest{ border-top:none; border-left:1px solid rgba(255,255,255,0.12); padding:6px 0 6px 36px; display:block; }
    .hero-invest .hi-val{ display:block; font-size:19px; }
    .hero-invest .hi-sub{ display:block; margin-top:6px; }
  }
  .badge{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; font-weight:600;
    padding: 12px 14px; border-radius:var(--r-md); display:flex; gap:10px; align-items:center;
    background: var(--bg-card); border:1px solid var(--line); color: var(--ink);
    box-shadow: var(--shadow-sm); flex:1; min-width:0;
  }
  .badge .bicon{
    font-size:13px; width:34px; height:34px; padding:8px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; background: var(--bg-card2); color: var(--ink-dim);
    box-sizing:border-box;
  }
  .badge .btext{ display:flex; flex-direction:column; min-width:0; flex:1; }
  .badge .blabel{ font-family:'Work Sans',sans-serif; font-weight:600; font-size:9px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); display:block; margin-bottom:2px; }
  .badge .bval{ font-size:14.5px; }
  .badge .bdelta{ font-family:'Work Sans',sans-serif; font-weight:700; font-size:10px; margin-left:7px; letter-spacing:0.01em; white-space:nowrap; }
  .badge .bdelta.up{ color: var(--gold); }
  .badge .bdelta.down{ color: var(--rust); }
  .badge.receitas .bicon{ background: var(--gold-dim); color: var(--gold); }
  .badge.receitas .bval{ color: var(--gold); }
  .badge.despesas .bicon{ background: var(--rust-dim); color: var(--rust); }
  .badge.despesas .bval{ color: var(--rust); }
  .badge.saldo-com .bicon{ background: var(--navy-dim); color: var(--navy); }
  .badge.saldo-com.neg .bval{ color: var(--rust); }
  .badge.caixinha .bicon{ background: var(--teal-dim); color: var(--teal); }
  .badge.caixinha .bval{ color: var(--teal); }
  .badge.cumulativo .bicon{ background: var(--bg-card2); color: var(--ink-dim); }

  .group{
    background: var(--bg-card); border:1px solid var(--line); border-radius:var(--r-lg);
    padding: 16px 17px 8px; margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
  }
  .group h3{
    font-size:13.5px; letter-spacing:0.01em; color:var(--ink);
    margin:0 0 10px; display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:700;
  }
  .group h3 .htitle{ display:flex; align-items:center; gap:9px; }
  .group h3 .htitle svg{
    width:30px; height:30px; padding:7px; box-sizing:border-box; border-radius:9px; background:var(--bg-card2); color:var(--ink-dim);
  }
  .group h3 .tot{ font-family:'IBM Plex Mono',monospace; color:var(--ink); font-size:13.5px; }
  .group.receitas h3 .tot{ color: var(--gold); }
  .group.receitas h3 .htitle svg{ background:var(--gold-dim); color: var(--gold); }
  .group.debito h3 .tot{ color: var(--rust); }
  .group.debito h3 .htitle svg{ background:var(--rust-dim); color: var(--rust); }
  .group.invest{ background: var(--bg-card); }
  .group.invest h3 .tot{ color: var(--teal); }
  .group.invest h3 .htitle svg{ background:var(--teal-dim); color: var(--teal); }

  .row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--bg-card2); font-size:13.5px; align-items:center; }
  .row:last-child{ border-bottom:none; }
  .row .n{ color:var(--ink); flex:1; min-width:0; }
  .row .v{ font-family:'IBM Plex Mono',monospace; color:var(--ink-dim); white-space:nowrap; margin-left:8px; }
  .group.receitas .row .v{ color:var(--gold); font-weight:600; }
  .group.debito .row .v{ color:var(--rust); font-weight:600; }

  /* ---------- CONFIRM MODE: checkable items ---------- */
  .citem{
    display:flex; align-items:center; gap:11px; padding:10px 0; border-bottom:1px solid var(--bg-card2);
    position:relative;
  }
  .citem:last-child{ border-bottom:none; }
  button.check{ padding:0; font-family:inherit; }
  .cdel{
    width:26px; height:26px; margin-left:-7px; margin-right:-6px; padding:0; border-radius:8px; border:none; background:none; color:var(--ink-faint);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    opacity:0.55; transition: opacity .15s, background .12s, color .12s, width .15s, margin .15s;
  }
  .cdel svg{ width:14px; height:14px; flex-shrink:0; }
  .cdel:hover, .cdel:focus-visible{ background:var(--rust-dim); color:var(--rust); opacity:1; }
  @media (hover:hover){
    /* com mouse, a lixeira só aparece na linha em que o ponteiro está */
    .cdel{ width:0; margin-left:-11px; margin-right:0; opacity:0; overflow:hidden; }
    .citem:hover .cdel, .cdel:focus-visible{ width:26px; margin-left:-7px; margin-right:-6px; opacity:0.7; }
    .citem:hover .cdel:hover{ opacity:1; }
  }
  .check{
    width:22px; height:22px; border-radius:7px; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; color:transparent;
    transition: all .12s; background:var(--bg-card2);
  }
  .group.receitas .check.on{ background:var(--gold); border-color:var(--gold); color:#fff; }
  .group.debito .check.on{ background:var(--rust); border-color:var(--rust); color:#fff; }
  .group.invest .check.on{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .citem .ctext{ flex:1; min-width:0; }
  .citem .cdesc{ font-size:13.5px; color:var(--ink); font-weight:500; }
  .citem.confirmado .cdesc{ text-decoration: line-through; opacity:0.4; }
  .citem .cval{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:600; color:var(--ink-dim); white-space:nowrap; cursor:pointer; padding:3px 5px; border-radius:6px; }
  .citem .cval:hover{ background: var(--bg-card2); }
  .group.receitas .citem .cval{ color:var(--gold); }
  .group.debito .citem .cval{ color:var(--rust); }
  .citem.ilustrativo{ opacity:0.65; }
  .citem.ilustrativo .venc-tag{ font-style:italic; }
  .cval-ilustrativo{ cursor:default; }
  .cval-ilustrativo:hover{ background:none; }
  .cval-input{
    font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:600; width:84px; text-align:right;
    border:1px solid var(--ink-faint); border-radius:6px; padding:2px 6px; background:var(--bg-card); color:var(--ink);
  }

  .falta-line{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin: -4px 0 7px; padding:0 2px; display:flex; justify-content:space-between; gap:10px; }
  .falta-line.ok span:first-child{ color: var(--gold); }
  .gprog-bar{ height:4px; border-radius:99px; background:var(--bg-card2); overflow:hidden; margin:0 2px 6px; }
  .gprog-bar i{ display:block; height:100%; border-radius:99px; }
  .group.receitas .gprog-bar i{ background:var(--gold); }
  .group.debito .gprog-bar i{ background:var(--rust); }
  .venc-note{ font-size:11px; color:var(--ink-faint); margin: -4px 0 10px; padding:0 2px; }
  .venc-tag{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; }
  .row .n{ display:flex; flex-direction:column; }

  .add-row{ display:flex; gap:7px; padding:10px 0 4px; }
  .add-row input{
    font-family:'Work Sans',sans-serif; font-size:12.5px; background: var(--bg-card2); border:1px solid transparent;
    border-radius:var(--r-sm); padding:9px 10px; color:var(--ink);
  }
  .add-row .din{ flex:1; min-width:0; }
  .add-row .dval{ width:84px; font-family:'IBM Plex Mono',monospace; }
  .add-row .ddia{ width:52px; font-family:'IBM Plex Mono',monospace; text-align:center; }
  .add-row button{
    background: rgb(var(--invert-rgb)); color:#fff; border:none; border-radius:var(--r-sm); padding:0 16px;
    font-weight:700; font-size:16px; cursor:pointer; flex-shrink:0; transition: opacity .12s;
  }
  .add-row button:hover{ opacity:0.82; }

  /* ---------- YEAR / MILESTONE CARDS (simulação) ---------- */
  .year-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .year-card{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--r-md); padding:14px 15px; box-shadow: var(--shadow-sm); cursor:pointer; transition: border-color .15s, box-shadow .15s, transform .1s; }
  .year-card.clickable:hover{ border-color: var(--gold); transform: translateY(-1px); }
  .year-card.open{ border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-dim), var(--shadow-md); }
  .year-card .ynum{ font-family:'Fraunces',Georgia,serif; font-size:18px; font-weight:700; color:var(--ink); margin-bottom:9px; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .year-card .ynum .ychev{ font-size:11px; color:var(--ink-faint); transition: transform .15s; }
  .year-card.open .ynum .ychev{ transform: rotate(180deg); color:var(--gold); }
  .year-card .yrow{ display:flex; justify-content:space-between; gap:6px; font-size:11px; padding:4px 0; border-top:1px solid var(--bg-card2); }
  .year-card .yrow:first-of-type{ border-top:none; }
  .year-card .ylabel{ color:var(--ink-faint); }
  .year-card .yval{ font-family:'IBM Plex Mono',monospace; color:var(--ink); font-weight:600; white-space:nowrap; }
  .year-card .yval.rend{ color:var(--teal); }
  .year-detalhe{ display:none; margin: -6px 0 22px; background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--r-lg); padding:18px 18px 8px; box-shadow: var(--shadow-sm); }
  .year-detalhe.open{ display:block; }
  .year-detalhe-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .year-detalhe-title{ font-family:'Fraunces',Georgia,serif; font-size:17px; font-weight:700; color:var(--ink); }
  .year-detalhe-sub{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .year-detalhe-close{ background:var(--bg-card2); border:1px solid var(--line); border-radius:8px; padding:7px 13px; font-size:12px; font-weight:600; cursor:pointer; color:var(--ink-dim); }
  .year-detalhe-close:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .yd-stats{ display:grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
  .yd-stat{ background:var(--bg-card2); border-radius:var(--r-sm); padding:10px 12px; }
  .yd-stat .lbl{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.04em; }
  .yd-stat .val{ font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:700; color:var(--ink); margin-top:3px; }
  .yd-stat .val.rend{ color:var(--teal); }
  .yd-alloc{ font-size:10px; color:var(--ink-faint); line-height:1.6; }

  .section-title{ font-family:'Fraunces',Georgia,serif; font-size:15px; font-weight:700; margin: 4px 0 12px; color:var(--ink); display:flex; align-items:center; gap:9px; }
  .section-title svg{ width:28px; height:28px; padding:6px; box-sizing:border-box; border-radius:9px; background:var(--gold-dim); color: var(--gold); }

  .empty-hint{ padding:20px 6px; text-align:center; color:var(--ink-faint); font-size:12.5px; }
  .save-indicator{ text-align:center; font-size:10.5px; color:var(--ink-faint); padding:6px 0 0; height:16px; }

  .sync-note{
    font-size:10.5px; color:var(--ink-faint); text-align:center; padding: 6px 10px 0; line-height:1.5;
  }

  /* =========================================================================
     VIEW: VIAGEM (tema passaporte)
     ========================================================================= */
  .subnav{ display:flex; gap:6px; margin-bottom:14px; background:var(--bg-card2); padding:4px; border-radius:10px; }
  .subnavbtn{
    flex:1; background:none; border:none; padding:8px 6px; border-radius:8px; cursor:pointer;
    font-family:'Work Sans',sans-serif; font-size:12px; font-weight:600; color:var(--ink-dim);
  }
  .subnavbtn.active{ background:var(--bg-card); color:var(--navy); box-shadow:0 1px 3px rgba(33,30,25,0.08); }
  .subview{ display:none; }
  .subview.active{ display:block; }

  /* Roteiro */
  .chip-strip{ display:flex; align-items:center; gap:6px; overflow-x:auto; padding:2px 2px 14px; }
  .chip{
    flex-shrink:0; background:var(--bg-card); border:1px solid var(--navy-dim); border-radius:20px;
    padding:7px 13px; font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:12.5px; color:var(--navy);
    display:flex; flex-direction:column; align-items:center; gap:1px; white-space:nowrap;
  }
  .chip .chip-dias{ font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:9px; color:var(--ink-faint); }
  .chip-arrow{ flex-shrink:0; color:var(--gold); font-size:14px; }
  .timeline-city{ margin-bottom:16px; }
  .timeline-city h4{
    font-family:'Fraunces',Georgia,serif; font-size:15px; font-weight:700; color:var(--navy);
    margin:0 0 8px; display:flex; align-items:center; gap:8px;
  }
  .timeline-city h4 .tdias{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:500; color:var(--ink-faint); }
  .tl-item{ position:relative; padding:0 0 14px 20px; border-left:2px solid var(--navy-dim); margin-left:5px; }
  .tl-item:last-child{ border-left-color:transparent; padding-bottom:0; }
  .tl-item::before{ content:''; position:absolute; left:-6px; top:2px; width:10px; height:10px; border-radius:50%; background:var(--gold); border:2px solid var(--bg); }
  .tl-dia{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--teal); font-weight:600; }
  .tl-texto{ font-size:13px; color:var(--ink); margin-top:2px; }
  .tl-tag{
    display:inline-block; font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em;
    padding:2px 7px; border-radius:5px; margin-left:6px; vertical-align:middle;
  }
  .tl-tag.bv{ background:var(--teal-dim); color:var(--teal); }
  .tl-tag.fam{ background:var(--gold-dim); color:var(--gold); }
  .tl-tag.transit{ background:var(--navy-dim); color:var(--navy); }

  /* Custos */
  .custos-header{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
  .fx-label{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; }
  .fx-label input{
    width:72px; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--navy);
    background:var(--bg-card); border:1px solid var(--line); border-radius:7px; padding:6px 8px;
  }
  .custos-totais{ display:flex; gap:8px; }
  .custos-totais .ttot{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:700; color:var(--navy);
    background:var(--navy-dim); padding:6px 11px; border-radius:8px;
  }
  .custo-card{
    background:var(--bg-card); border:1px solid var(--line); border-left:3px solid var(--teal); border-radius:12px;
    padding:13px 15px 10px; margin-bottom:12px; box-shadow:0 1px 3px rgba(33,30,25,0.04);
  }
  .custo-card h4{
    font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-dim); font-weight:600;
    margin:0 0 8px; display:flex; justify-content:space-between; gap:8px;
  }
  .custo-card h4 .csub{ font-family:'IBM Plex Mono',monospace; color:var(--teal); }
  .custo-row{ display:flex; align-items:center; gap:7px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .custo-row:last-of-type{ border-bottom:none; }
  .custo-row input.ci-desc{ flex:1; min-width:0; font-family:'Work Sans',sans-serif; font-size:12.5px; }
  .custo-row input.ci-valor{ width:70px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; text-align:right; }
  .custo-row input{ background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 7px; color:var(--ink); }
  .custo-row .ci-brl{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); width:78px; text-align:right; white-space:nowrap; }
  .custo-row .ci-del{ background:none; border:none; color:var(--ink-faint); font-size:15px; cursor:pointer; padding:2px 0 2px 3px; flex-shrink:0; }
  .custo-add{ background:none; border:1px dashed var(--line); color:var(--teal); border-radius:7px; padding:6px 10px; font-size:11.5px; font-weight:600; cursor:pointer; margin-top:6px; }
  table.custo-table{ width:100%; border-collapse:collapse; font-size:11.5px; }
  table.custo-table th{ text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-faint); padding:4px 4px; border-bottom:1px solid var(--line); }
  table.custo-table td{ padding:4px 4px; border-bottom:1px dashed var(--line); }
  table.custo-table input{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:5px 6px; font-family:'Work Sans',sans-serif; font-size:11.5px; color:var(--ink); }
  table.custo-table input.ci-valor{ font-family:'IBM Plex Mono',monospace; text-align:right; }
  table.custo-table .ci-brl{ font-family:'IBM Plex Mono',monospace; color:var(--ink-faint); white-space:nowrap; }

  /* Desafio 40k */
  .desafio-header{ margin-bottom:12px; }
  .desafio-casal-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; margin-bottom:16px; }
  .desafio-casal-grid .dcard{ background:var(--navy); color:#14151C; border-radius:10px; padding:11px 13px; }
  .desafio-casal-grid .dlabel{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.03em; opacity:0.75; margin-bottom:3px; }
  .desafio-casal-grid .dval{ font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:700; }
  .desafio-pessoas{ display:grid; grid-template-columns:1fr; gap:16px; }
  .desafio-pessoa-card{ background:var(--bg-card); border:1px solid var(--line); border-radius:12px; padding:15px; box-shadow:0 1px 3px rgba(33,30,25,0.04); }
  .desafio-pessoa-card h3{ font-family:'Fraunces',Georgia,serif; font-size:16px; color:var(--navy); margin:0 0 10px; }
  .desafio-summary-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin-bottom:12px; }
  .desafio-summary-grid .dcard{ background:var(--bg-card2); border-radius:9px; padding:9px 10px; }
  .desafio-summary-grid .dlabel{ font-size:9px; text-transform:uppercase; letter-spacing:0.02em; color:var(--ink-faint); margin-bottom:2px; }
  .desafio-summary-grid .dval{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:700; color:var(--navy); }
  table.desafio-table{ width:100%; border-collapse:collapse; font-size:11.5px; max-height:340px; }
  table.desafio-table th{ text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-faint); padding:5px 4px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg-card); }
  table.desafio-table td{ padding:4px 4px; border-bottom:1px dashed var(--line); font-family:'IBM Plex Mono',monospace; }
  table.desafio-table td:first-child{ font-family:'Work Sans',sans-serif; }
  table.desafio-table input{ width:82px; background:var(--bg); border:1px solid var(--line); border-radius:5px; padding:5px 6px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-align:right; color:var(--ink); }
  .desafio-table-wrap{ max-height:360px; overflow-y:auto; }

  /* =========================================================================
     DESKTOP DASHBOARD (telas largas — header fixo no topo + conteúdo abaixo)
     ========================================================================= */
  @media (min-width: 880px){
    .app{ max-width: none; }

    .topbar{
      position: static;
      padding: 14px 32px 12px;
    }
    .month-picker{ max-width: 420px; margin: 0 auto; }

    .content{
      margin-left: 0;
      max-width: 1800px;
      margin-right:auto; margin-left:auto; width:100%;
      padding: 24px 48px calc(100px + var(--safe-bottom));
      box-sizing: border-box;
    }

    .badges{
      display:grid; grid-template-columns: repeat(4, 1fr); gap:12px;
      margin-bottom: 22px;
    }
    .badge{
      flex-direction:row; align-items:center; gap:14px;
      padding: 18px 20px; border-radius:12px;
    }
    .badge .bicon{ font-size:16px; width:42px; height:42px; }
    .badge .blabel{ font-size:10.5px; }
    .badge .bval{ font-size:18px; }

    /* colunas ao estilo "masonry" via CSS columns — evita os buracos que um CSS
       Grid comum deixa quando os cards têm alturas bem diferentes (cada card flui
       pra próxima posição livre, em vez de travar todos numa mesma linha). */
    #confBody{
      columns: 2;
      column-gap: 16px;
    }
    @media (min-width: 1280px){
      #confBody{ columns: 3; }
    }
    #confBody .group{
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
    }
    .group{ margin-bottom:16px; }

    .year-grid{ grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); }

    .sync-note{ max-width: 500px; margin: 8px auto 0; }
    .save-indicator{ grid-column: 1 / -1; }

    .custos-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; align-items:start; }
    .custo-card{ margin-bottom:0; }
    .desafio-pessoas{ grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); }
  }

  /* =========================================================================
     BOTÕES
     ========================================================================= */
  .btn{
    font-family:'Work Sans',sans-serif; font-size:12.5px; font-weight:600; border-radius:var(--r-sm); padding:9px 13px; cursor:pointer;
    border:1px solid var(--line); background:var(--bg-card2); color:var(--ink);
    display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap;
    transition: background .12s, border-color .12s, opacity .12s;
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn.pri{ background:var(--gold); border-color:var(--gold); color:#0A0A0B; }
  .btn.pri:hover{ opacity:0.88; }
  .btn.fantasma{ background:none; border-color:transparent; color:var(--ink-dim); }
  .btn.fantasma:hover{ color:var(--ink); border-color:var(--line); }
  .btn.perigo{ background:none; border-color:transparent; color:var(--rust); }
  .btn.perigo:hover{ border-color:var(--rust); }
  .btn.mini{ padding:7px 11px; font-size:12px; }

  /* =========================================================================
     VIEW: INVESTIMENTOS
     ========================================================================= */
  .inv-topo{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:6px 0 12px; }
  .inv-topo .section-title{ margin:0; }
  .inv-grid{ display:grid; gap:14px; grid-template-columns:minmax(0,1fr); align-items:start; }
  .inv-card{
    background:var(--bg-card); border:1px solid var(--line); border-radius:var(--r-lg);
    padding:16px 17px 10px; box-shadow:var(--shadow-sm); min-width:0;
  }
  .inv-card.encerrado{ opacity:0.62; }
  .inv-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .inv-nome{ font-family:'Fraunces',Georgia,serif; font-size:17px; font-weight:700; color:var(--ink); line-height:1.25; overflow-wrap:anywhere; }
  .inv-chips{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .inv-chip{ font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:99px; background:var(--bg-card2); color:var(--ink-dim); }
  .inv-chip.enc{ background:var(--amber-dim); color:var(--amber); }
  .inv-saldo{ text-align:right; flex-shrink:0; }
  .inv-saldo .l{ font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:2px; }
  .inv-saldo .v{ font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:700; color:var(--ink); white-space:nowrap; }
  .inv-objetivo{
    margin:13px 0 12px; padding:10px 12px; border-left:3px solid var(--teal); background:var(--bg-card2);
    border-radius:0 var(--r-sm) var(--r-sm) 0; font-size:13px; line-height:1.5; color:var(--ink); white-space:pre-line; overflow-wrap:anywhere;
  }
  .inv-objetivo .l{ display:block; font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); margin-bottom:3px; }
  .inv-objetivo em{ color:var(--ink-faint); }
  .inv-obs{ font-size:11.5px; color:var(--ink-dim); margin:-4px 2px 12px; line-height:1.5; white-space:pre-line; overflow-wrap:anywhere; }
  .inv-stats{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin-bottom:12px; }
  .inv-stats .t{ background:var(--bg-card2); border-radius:9px; padding:8px 10px; min-width:0; }
  .inv-stats .l{ font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--ink-faint); margin-bottom:3px; }
  .inv-stats .v{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .inv-stats .v.pos{ color:var(--teal); }
  .inv-stats .v.neg{ color:var(--rust); }
  .inv-stats .s{ font-size:9.5px; color:var(--ink-faint); margin-top:1px; }
  .inv-acoes{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px; }
  @media (max-width: 480px){ .inv-acoes .btn{ flex:1 1 0; padding-left:6px; padding-right:6px; } }
  .inv-editar{ background:none; border:none; padding:5px 0 0; margin:0; cursor:pointer; font-family:'Work Sans',sans-serif; font-size:11.5px; font-weight:600; color:var(--gold); }
  .inv-editar:hover{ text-decoration:underline; }
  .mov{
    display:flex; align-items:center; gap:10px; padding:9px 2px; width:100%; border:none; border-top:1px solid var(--bg-card2);
    background:none; color:inherit; font:inherit; text-align:left; cursor:pointer;
  }
  .mov:hover{ background:rgba(255,255,255,0.03); }
  .mov-data{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-faint); width:70px; flex-shrink:0; }
  .mov-meio{ flex:1; min-width:0; display:block; }
  .mov-tipo{ display:block; font-size:13px; font-weight:500; color:var(--ink); }
  .mov-obs{ display:block; font-size:10.5px; color:var(--ink-faint); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mov-dir{ display:block; text-align:right; flex-shrink:0; }
  .mov-val{ display:block; font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap; }
  .mov-val.pos{ color:var(--teal); }
  .mov-val.neg{ color:var(--rust); }
  .mov-saldo{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-faint); white-space:nowrap; margin-top:1px; }
  .mov-mais{ width:100%; margin-top:2px; }
  .inv-vazio{
    border:1px dashed var(--line); border-radius:var(--r-lg); padding:28px 22px; text-align:center;
    color:var(--ink-dim); font-size:13px; line-height:1.6;
  }
  .inv-vazio strong{ display:block; color:var(--ink); font-size:14.5px; margin-bottom:6px; }
  .ledger-scroll.inv-meses table{ min-width:0; }
  .ledger-scroll.inv-meses thead th, .ledger-scroll.inv-meses tbody td{ padding-left:9px; padding-right:9px; }
  .inv-meses td.money, .inv-meses th.money{ text-align:right; }
  @media (max-width: 480px){ .ledger-scroll.inv-meses table{ font-size:11px; } .ledger-scroll.inv-meses thead th, .ledger-scroll.inv-meses tbody td{ padding-left:5px; padding-right:5px; } .ledger-scroll.inv-meses td:first-child, .ledger-scroll.inv-meses th:first-child{ padding-left:9px; } .ledger-scroll.inv-meses td:last-child, .ledger-scroll.inv-meses th:last-child{ padding-right:9px; } }
  @media (min-width: 880px){
    .inv-grid{ grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); gap:16px; }
  }

  /* =========================================================================
     JANELA DE FORMULÁRIO (sobe de baixo no celular)
     ========================================================================= */
  .sheet-fundo{
    position:fixed; inset:0; z-index:90; background:rgba(0,0,0,0.62);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    width:100%; max-width:520px; max-height:92dvh; overflow-y:auto; background:var(--bg-panel);
    border:1px solid var(--line); border-radius:22px 22px 0 0; padding:18px 18px calc(18px + var(--safe-bottom));
    box-shadow:var(--shadow-md);
  }
  @media (min-width: 640px){
    .sheet-fundo{ align-items:center; padding:24px; }
    .sheet{ border-radius:22px; padding:22px; }
  }
  .sheet-topo{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
  .sheet-topo h2{ font-family:'Fraunces',Georgia,serif; font-size:18px; font-weight:700; margin:3px 0 0; color:var(--ink); line-height:1.25; overflow-wrap:anywhere; }
  .sheet-x{ background:var(--bg-card2); border:none; color:var(--ink-dim); width:32px; height:32px; border-radius:10px; cursor:pointer; font-size:14px; flex-shrink:0; }
  .sheet-x:hover{ color:var(--ink); }
  /* ---------- ASSINATURAS ---------- */
  .ass-card{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--r-lg); padding:6px 15px; box-shadow:var(--shadow-sm); margin-bottom:14px; min-width:0; }
  .ass-linha{ display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; padding:11px 0; border:none; border-bottom:1px dashed var(--line); background:none; font:inherit; color:inherit; text-align:left; cursor:pointer; }
  .ass-linha:last-child{ border-bottom:none; }
  .ass-linha .n{ font-size:13.5px; color:var(--ink); font-weight:500; min-width:0; display:flex; flex-direction:column; }
  .ass-linha .sub{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; font-weight:400; }
  .ass-linha .v{ font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:600; color:var(--rust); white-space:nowrap; }
  .ass-linha.total{ cursor:default; border-top:1px solid var(--line); }
  .ass-linha.total .n{ font-weight:600; }
  .ass-linha.total .v{ color:var(--ink); }
  .ass-ano{ display:flex; align-items:center; justify-content:center; gap:14px; margin:10px 0 4px; }
  .ass-ano b{ font-family:'Fraunces',Georgia,serif; font-size:17px; color:var(--ink); min-width:52px; text-align:center; }
  .ass-resumo{ text-align:center; font-size:11.5px; color:var(--ink-faint); margin-bottom:12px; line-height:1.5; }
  .ass-meses{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; }
  .ass-mes{ background:var(--bg-card2); border:1px solid transparent; border-radius:var(--r-sm); padding:9px 10px 8px; text-align:left; cursor:pointer; font-family:'Work Sans',sans-serif; color:var(--ink); display:flex; flex-direction:column; gap:2px; min-width:0; transition: background .12s, border-color .12s; }
  .ass-mes:hover{ border-color:var(--line); }
  .ass-mes .m{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); display:flex; justify-content:space-between; }
  .ass-mes .p{ font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ass-mes .s{ font-size:10.5px; color:var(--rust); }
  .ass-mes.pago{ background:var(--teal-dim); border-color:var(--teal); }
  .ass-mes.pago .s, .ass-mes.pago .m{ color:var(--teal); }
  .ass-mes.atual{ box-shadow:0 0 0 2px var(--gold); }
  .ass-mes.vazio{ opacity:0.45; cursor:default; }
  .ass-mes.vazio .s{ color:var(--ink-faint); }
  .ass-pessoas{ margin-top:14px; }
  .ass-pessoa{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); }
  .ass-pessoa:last-child{ border-bottom:none; }
  .ass-pessoa .pn{ flex:1; min-width:0; font-size:13px; font-weight:600; color:var(--ink); overflow-wrap:anywhere; }
  .ass-pessoa .pn small{ display:block; font-weight:400; font-size:10.5px; color:var(--ink-faint); margin-top:2px; }
  .ass-pessoa.ok .pn{ color:var(--teal); }
  .ass-pessoa .pv{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dim); white-space:nowrap; }
  .ass-dica{ font-size:11px; color:var(--ink-faint); line-height:1.5; margin:12px 0 8px; }

  .campo{ display:block; margin-bottom:12px; min-width:0; }
  .campo > span{ display:block; font-size:11.5px; font-weight:600; color:var(--ink-dim); margin-bottom:5px; }
  .campo > span em{ font-style:normal; font-weight:400; color:var(--ink-faint); }
  .campo input, .campo textarea{
    width:100%; background:var(--bg-card2); border:1px solid var(--line); color:var(--ink);
    font-family:'Work Sans',sans-serif; font-size:16px; padding:10px 12px; border-radius:var(--r-sm); outline:none;
  }
  .campo textarea{ min-height:68px; resize:vertical; line-height:1.45; }
  .campo input:focus, .campo textarea:focus{ border-color:var(--gold); }
  .campo input.num{ font-family:'IBM Plex Mono',monospace; }
  .campo-linha{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .check-linha{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink); margin:0 0 12px; cursor:pointer; }
  .check-linha input{ width:18px; height:18px; accent-color:var(--gold); flex-shrink:0; }
  .seg{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px; background:var(--bg-card2); padding:4px; border-radius:12px; margin-bottom:10px; }
  .seg.n4{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  @media (min-width: 480px){ .seg.n4{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .seg button{
    background:none; border:none; padding:9px 2px; border-radius:9px; cursor:pointer;
    font-family:'Work Sans',sans-serif; font-size:12px; font-weight:600; color:var(--ink-dim); white-space:nowrap;
  }
  .seg button.on{ background:var(--bg-card); color:var(--ink); box-shadow:var(--shadow-sm); }
  .sheet-dica{ font-size:12px; color:var(--ink-dim); line-height:1.5; margin:0 0 14px; }
  .sheet-previa{ font-size:12.5px; line-height:1.5; background:var(--bg-card2); border-radius:var(--r-sm); padding:10px 12px; margin:0 0 12px; color:var(--ink-dim); }
  .sheet-previa b{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink); white-space:nowrap; }
  .sheet-erro{ font-size:12.5px; line-height:1.45; color:var(--rust); margin:0 0 10px; }
  .sheet-erro:empty{ display:none; }
  .sheet-acoes{ display:flex; gap:8px; justify-content:flex-end; align-items:center; margin-top:4px; }
  .sheet-acoes .esq{ margin-right:auto; }

  /* =========================================================================
     VIEW: CONQUISTAS
     ========================================================================= */
  .cq-lede{ font-size:13px; color:var(--ink-dim); line-height:1.55; margin:2px 2px 16px; max-width:56ch; }

  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; margin-bottom:18px; }
  .stat{ background:var(--bg-card); padding:14px 14px; display:flex; flex-direction:column; gap:3px; }
  .stat-value{ font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600; color:var(--gold); }
  .stat-label{ font-size:11px; color:var(--ink-dim); line-height:1.3; }

  .goal-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-bottom:18px; }
  .goal{ background:var(--bg-card); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 14px; display:flex; flex-direction:column; gap:7px; box-shadow:var(--shadow-sm); }
  .goal-top{ display:flex; align-items:flex-start; gap:9px; }
  .goal input[type="checkbox"]{ appearance:none; width:18px; height:18px; flex:none; margin-top:2px; border:1.5px solid var(--ink-faint); border-radius:5px; cursor:pointer; display:grid; place-content:center; background:var(--bg-card); }
  .goal input[type="checkbox"]::after{ content:""; width:9px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translateY(-1px); opacity:0; }
  .goal input[type="checkbox"]:checked{ background:var(--gold); border-color:var(--gold); }
  .goal input[type="checkbox"]:checked::after{ opacity:1; }
  .goal.done .goal-name{ color:var(--ink-faint); text-decoration:line-through; }
  .goal.done{ background:var(--bg-card2); }
  .goal-name{ font-weight:600; font-size:14px; line-height:1.3; color:var(--ink); }
  .goal-value{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-dim); }
  .goal-tags{ display:flex; gap:5px; flex-wrap:wrap; }
  .tag{ font-size:9.5px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; padding:3px 7px; border-radius:99px; }
  .tag-topo{ background:var(--gold-dim); color:var(--gold); }
  .tag-est{ background:var(--amber-dim); color:var(--amber); }
  .goal details{ margin-top:1px; }
  .goal summary{ cursor:pointer; font-size:11.5px; color:var(--ink-dim); }
  .goal details ul{ margin:7px 0 0; padding-left:16px; font-size:11.5px; color:var(--ink-dim); display:grid; gap:2px; }

  .rule{ background:var(--gold-dim); border-radius:var(--r-md); padding:16px 18px; border-left:4px solid var(--gold); display:flex; flex-direction:column; gap:5px; margin-bottom:18px; }
  .rule-kicker{ margin:0; font-size:11px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700; color:var(--gold); }
  .rule p{ margin:0; font-size:13.5px; line-height:1.6; color:var(--ink); }

  .ledger-scroll{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--shadow-sm); margin-bottom:18px; }
  .ledger-scroll table{ border-collapse:collapse; width:100%; min-width:680px; font-size:12.5px; background:var(--bg-card); }
  .ledger-scroll thead th{ position:sticky; top:0; background:var(--bg-card2); text-align:left; padding:9px 12px; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-dim); border-bottom:1px solid var(--line); white-space:nowrap; }
  .ledger-scroll tbody td{ padding:8px 12px; border-bottom:1px solid var(--bg-card2); white-space:nowrap; color:var(--ink); }
  .ledger-scroll tbody tr:last-child td{ border-bottom:none; }
  td.money, th.money{ font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; }
  .ledger-scroll td:first-child, .ledger-scroll th:first-child{ position:sticky; left:0; background:var(--bg-card); font-weight:600; box-shadow:1px 0 0 var(--line); }
  tr.hit td{ background:var(--gold-dim); }
  tr.hit td:first-child{ background:var(--gold-dim); font-weight:700; }
  .conquista-col{ white-space:normal !important; min-width:180px; max-width:230px; color:var(--ink-faint); }
  .conquista-col.win{ color:var(--gold); font-weight:600; }

  .pending-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .pending-card{ background:var(--bg-card); border:1px dashed var(--line); border-radius:var(--r-md); padding:12px 14px; display:flex; flex-direction:column; gap:4px; }
  .pending-card .goal-name{ font-size:13.5px; }
  .pending-card p{ margin:0; font-size:11.5px; color:var(--ink-dim); line-height:1.5; }

  @media (min-width: 880px){
    .goal-grid{ grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
    .pending-grid{ grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
  }

  /* ---------- TELA DE ENTRADA + AVISO DE GRAVAÇÃO ---------- */
  .sync-note a{ color:var(--ink-dim); text-decoration:underline; cursor:pointer; }
  .portao{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .portao-card{ width:100%; max-width:340px; text-align:center; }
  .portao-card h1{
    font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:24px; margin:0 0 10px;
    letter-spacing:-0.02em; color:var(--ink);
  }
  .portao-card h1 .dot{ color:var(--gold); }
  .portao-card p{ font-size:13px; line-height:1.55; color:var(--ink-dim); margin:0 0 18px; }
  .portao-card input{
    width:100%; background:var(--bg-card2); border:1px solid var(--line); color:var(--ink);
    font-family:'IBM Plex Mono',monospace; font-size:14px; padding:13px 14px; border-radius:var(--r-md);
    outline:none; margin-bottom:10px;
  }
  .portao-card input:focus{ border-color:var(--gold); }
  .portao-card button{
    width:100%; background:var(--gold); color:#0A0A0B; border:none; cursor:pointer;
    font-family:'Work Sans',sans-serif; font-size:14.5px; font-weight:700; padding:13px; border-radius:var(--r-md);
  }
  .portao-card button:disabled{ opacity:0.6; cursor:default; }
  .portao-erro{ font-size:12.5px; line-height:1.5; color:var(--rust); margin-top:12px; text-align:left; white-space:pre-line; }
  .status-sync{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + var(--safe-bottom)); z-index:40;
    background:rgba(var(--invert-rgb),0.94); color:var(--ink-dim); border:1px solid var(--line);
    font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:999px; box-shadow:var(--shadow-sm);
    opacity:0; pointer-events:none; transition:opacity .2s; white-space:nowrap;
  }
  .status-sync.visivel{ opacity:1; }
  .status-sync.erro{ color:var(--rust); border-color:var(--rust); pointer-events:auto; cursor:pointer; }
  @media (min-width: 880px){ .status-sync{ bottom:20px; } }
</style>
</head>
<body>
<div class="portao" id="portao">
  <form class="portao-card" id="portaoForm" autocomplete="off">
    <h1>Minha Vida <span class="dot">·</span> Financeira</h1>
    <p id="portaoTexto">Carregando…</p>
    <input type="password" id="portaoChave" placeholder="Chave de acesso" hidden>
    <button type="submit" id="portaoBtn" hidden>Entrar</button>
    <div class="portao-erro" id="portaoErro"></div>
  </form>
</div>
<div class="status-sync" id="statusSync"></div>
<div class="app">

  <div class="topbar">
    <h1>Minha Vida <span class="dot">·</span> Financeira</h1>
    <div class="month-picker" id="monthPicker">
      <button id="mesAnterior" aria-label="Mês anterior">‹</button>
      <select id="mesSelect" aria-label="Mês"></select>
      <button id="mesProximo" aria-label="Próximo mês">›</button>
      <button id="mesHoje" class="hoje" hidden>hoje</button>
    </div>
  </div>

  <div class="content">

    <!-- VIEW: MEU MÊS -->
    <div class="view active" id="view-confirmar">
      <div id="saldoAtualCard"></div>
      <div class="badges" id="confBadges"></div>
      <div class="section-title" style="margin-top:2px;"><svg class="icon" viewBox="0 0 24 24"><path d="M11 6h9"/><path d="M11 12h9"/><path d="M11 18h9"/><path d="m3 6 1.5 1.5L7 5"/><path d="m3 12 1.5 1.5L7 11"/><path d="m3 18 1.5 1.5L7 17"/></svg>Checklist do mês</div>
      <div id="confBody"></div>
    </div>

    <!-- VIEW: INVESTIMENTOS -->
    <div class="view" id="view-investimentos">
      <div id="invResumo"></div>
      <div class="inv-topo">
        <div class="section-title"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>Meus investimentos</div>
        <button class="btn pri mini" data-inv="novo" id="invNovo">+ Novo</button>
      </div>
      <div class="inv-grid" id="invLista"></div>
      <div id="invMeses"></div>
    </div>

    <!-- VIEW: ASSINATURAS -->
    <div class="view" id="view-assinaturas">
      <div id="assCartao"></div>
      <div class="inv-topo">
        <div class="section-title"><svg class="icon" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>Assinaturas</div>
        <button class="btn pri mini" data-ass="nova">+ Nova</button>
      </div>
      <div id="assLista"></div>
      <div id="assDivisao"></div>
    </div>

    <!-- VIEW: SIMULAÇÃO -->
    <div class="view" id="view-simulacao">
      <div class="section-title"><svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Resumo por ano</div>
      <p class="cq-lede" id="simLede"></p>
      <div class="year-grid" id="yearCards"></div>
      <div class="year-detalhe" id="yearDetalhe"></div>
      <div id="marcosBloco" hidden>
        <div class="section-title"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Marcos</div>
        <div class="year-grid" id="milestoneCards"></div>
      </div>
    </div>

    <!-- VIEW: VIAGEM -->
    <div class="view" id="view-viagem">
      <div class="subnav">
        <button class="subnavbtn active" data-sub="roteiro">Roteiro</button>
        <button class="subnavbtn" data-sub="custos">Custos</button>
        <button class="subnavbtn" data-sub="desafio">Desafio 40k</button>
      </div>

      <div class="subview active" id="sub-roteiro">
        <div class="chip-strip" id="chipStrip"></div>
        <div class="timeline" id="roteiroTimeline"></div>
      </div>

      <div class="subview" id="sub-custos">
        <div class="custos-header">
          <label class="fx-label">1 EUR = <input type="number" step="0.01" id="fxRateInput" onchange="viagemAtualizarFx(this.value)"> BRL</label>

      <div class="subview" id="sub-desafio">

          <label class="fx-label">CDI anual: <input type="number" step="0.01" id="cdiInput" onchange="viagemAtualizarCdi(this.value)"> % a.a.</label>

    <div class="save-indicator" id="saveIndicator"></div>
    <div class="sync-note" id="syncNote"></div>
  </div>

  <div class="bottomnav">
    <button class="navbtn active" data-view="confirmar">
      <span class="nicon"><svg class="icon" viewBox="0 0 24 24"><path d="M11 6h9"/><path d="M11 12h9"/><path d="M11 18h9"/><path d="m3 6 1.5 1.5L7 5"/><path d="m3 12 1.5 1.5L7 11"/><path d="m3 18 1.5 1.5L7 17"/></svg></span>Meu Mês
    </button>
    <button class="navbtn" data-view="investimentos">
      <span class="nicon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg></span>Investimentos
    </button>
    <button class="navbtn" data-view="assinaturas">
      <span class="nicon"><svg class="icon" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></span>Assinaturas
    </button>
    <button class="navbtn" data-view="simulacao">
      <span class="nicon"><svg class="icon" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span>Simulação
    </button>
    <button class="navbtn" data-view="viagem">
      <span class="nicon"><svg class="icon" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg></span>Viagem
    </button>

</div>

<div class="sheet-fundo" id="sheet" hidden>
  <form class="sheet" id="sheetForm" autocomplete="off" novalidate>
    <div class="sheet-topo">
      <h2 id="sheetTitulo"></h2>
      <button type="button" class="sheet-x" data-sheet="fechar" aria-label="Fechar">✕</button>
    </div>
    <div id="sheetCorpo"></div>
    <div class="sheet-erro" id="sheetErro" role="alert"></div>
    <div class="sheet-acoes">
      <button type="button" class="btn perigo esq" id="sheetExcluir" hidden>Excluir</button>
      <button type="button" class="btn fantasma" data-sheet="fechar">Cancelar</button>
      <button type="submit" class="btn pri" id="sheetOk">Salvar</button>

</div>
<script src="motor.js"></script>
<script src="sync.js"></script>
<script>
/* =========================================================================
   DADOS — tudo vem de data/financas.json, no repositório privado (lido e
   gravado por sync.js). O cálculo dos meses fica em motor.js. Nenhum dado
   financeiro fica escrito neste arquivo.
   ========================================================================= */
const REPO = 'EdLoth/minha-vida-financeira';
const ARQUIVO_DADOS = 'data/financas.json';
// Prévia no computador (http://localhost): lê o arquivo da própria pasta e não grava nada.
const MODO_LOCAL = ['localhost','127.0.0.1'].includes(location.hostname);

let DADOS = null;   // conteúdo do financas.json (o app altera este objeto e manda gravar)
let M = null;       // motor calculado a partir de DADOS
let SYNC = null;    // conexão com o repositório
let months = [], data = {}, monthStats = [], investimentos = [];

const NOMES_MES = Motor.NOMES_MES;
const fmt = v => v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const brl = v => (v<0? '−R$ ' : 'R$ ') + fmt(Math.abs(v));
function sumObj(o){ return Object.values(o).reduce((a,b)=>a+b,0); }
function anoDoLabel(m){ return 2000 + parseInt(m.split('/')[1], 10); }

// Itens de receita apenas ilustrativos aparecem no card, mas não entram em soma nenhuma.
function isReceitaIlustrativa(desc, mes){ return M.isReceitaIlustrativa(desc, mes); }
function vencimentoReceita(desc, mes){ const i = M.infoItem(mes,'receita',null,desc); return i ? i.vencimento : null; }
function diaVencimentoReceita(desc, mes){ const i = M.infoItem(mes,'receita',null,desc); return i ? i.dia : null; }
function vencimentoDespesa(desc, grupo, mes){ const i = M.infoItem(mes,'despesa',grupo,desc); return i ? i.vencimento : null; }
function diaVencimentoDespesa(desc, grupo, mes){ const i = M.infoItem(mes,'despesa',grupo,desc); return i ? i.dia : null; }
function notaDoGrupo(grupo){ const g = grupo && DADOS.grupos.find(x=>x.nome===grupo); return (g && g.nota) || null; }

const ICO = {
  up: '<svg class="icon bicon" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>',
  down: '<svg class="icon bicon" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>',
  wallet: '<svg class="icon bicon" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="14" r="1"/></svg>',
  box: '<svg class="icon bicon" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  stack: '<svg class="icon bicon" viewBox="0 0 24 24"><path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>',
  plane: '<svg class="icon" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>',
  trash: '<svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
};

/* =========================================================================
   ESTADO — confirmações, valores editados, itens removidos e itens avulsos.
   Mora em DADOS.estado (dentro do financas.json); as contas ficam no motor.
   ========================================================================= */
let ESTADO = { confirmados: {}, extras: {}, overrides: {}, excluidos: {} }; // extras[mes] = [{id,tipo,grupo,desc,valor,diaVencimento}] · overrides[chaveItem] = valor editado · excluidos[chaveItem] = true (item removido daquele mês)
let viagemCustos = null;
let viagemDesafio = null;
let mesAtualIdx = 0;

function chaveItem(mes, tipo, grupo, desc){ return Motor.chaveItem(mes, tipo, grupo, desc); }
function ajusteMesIdx(idx){ return M.ajusteMesIdx(idx); }
function ajusteAcumuladoAte(idx){ return M.ajusteAcumuladoAte(idx); }
function saldoAtualIdx(idx){ return M.saldoAtualIdx(idx); }
function saldoAtualTotal(idx){ return M.saldoAtualTotal(idx); }

// Nome legível de um item a partir da chave — vai na mensagem do commit.
function nomeDaChave(key){
  if(key.startsWith('extra:')){
    const id = key.slice(6);
    for(const mes in ESTADO.extras){
      const e = (ESTADO.extras[mes]||[]).find(x=>x.id===id);
      if(e) return `${e.desc} (${mes})`;
    }
    return 'item avulso';
  }
  const p = key.split('|');
  return `${p.slice(3).join('|')} (${p[0]})`;
}

// Toda alteração feita na tela passa por aqui: vira um commit no repositório.
function gravar(descricao){
  if(SYNC) SYNC.alterou(descricao);
  else mostrarStatus('local');
}
function salvarEstado(descricao){ gravar(descricao); }
function salvarViagemCustos(){ gravar('altera custos da viagem'); }
function salvarViagemDesafio(){ gravar('altera aportes do desafio 40k'); }

/* =========================================================================
   NAVEGAÇÃO
   ========================================================================= */
const mesSelect = document.getElementById('mesSelect');
function montarSeletorMeses(){
  mesSelect.innerHTML = '';
  months.forEach((m,idx)=>{
    const opt = document.createElement('option');
    opt.value = idx; opt.textContent = m;
    mesSelect.appendChild(opt);
  });
  mesSelect.value = mesAtualIdx;
}
mesSelect.addEventListener('change', ()=>{ mesAtualIdx = parseInt(mesSelect.value,10); renderAtual(); });
document.getElementById('mesAnterior').addEventListener('click', ()=>{
  if(mesAtualIdx>0){ mesAtualIdx--; mesSelect.value=mesAtualIdx; renderAtual(); }
});
document.getElementById('mesProximo').addEventListener('click', ()=>{
  if(mesAtualIdx<months.length-1){ mesAtualIdx++; mesSelect.value=mesAtualIdx; renderAtual(); }
});

function irPara(view){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+view).classList.add('active');
  document.getElementById('monthPicker').hidden = (view!=='confirmar'); // o mês só vale para "Meu Mês"

function itensExtrasDoMes(mes, tipo, grupo){
  return (ESTADO.extras[mes]||[]).filter(e=>e.tipo===tipo && (e.grupo||'')===(grupo||''));
}

// variação percentual vs. o mês anterior, pra badges. invertGood=true quando um
// aumento é uma notícia ruim (ex.: despesas) — daí a seta sobe mas a cor fica vermelha.
function pctDeltaHtml(curr, prev, invertGood){
  if(prev == null) return '';
  let isUp, txt;
  if(Math.abs(prev) < 0.005){
    if(Math.abs(curr) < 0.005) return '';
    isUp = curr >= 0;
    txt = 'novo';
  } else {
    const pct = ((curr-prev)/Math.abs(prev))*100;
    isUp = pct >= 0;
    txt = Math.abs(pct).toFixed(1)+'%';
  }
  const good = invertGood ? !isUp : isUp;
  return `<span class="bdelta ${good?'up':'down'}">${isUp?'▲':'▼'} ${txt}</span>`;
}

        ${medidor('rec', 'Recebido', T.recebido, T.receitas, T.faltaReceber, 'falta receber', 'tudo recebido')}
        ${medidor('pag', 'Pago', T.pago, T.despesas, T.faltaPagar, 'falta pagar', 'tudo pago')}
      </div>
      ${temCarteira ? `<button class="hero-invest" data-ir="investimentos"><span class="hero-label">Investido</span><span class="hi-val">${brl(T.investido)}</span><span class="hi-sub">ver investimentos ›</span></button>` : ''}

function renderSecaoConfirmavel(mes, tipo, grupo, titulo, itemsObj, classe){
  const itemsFixosTodos = Object.entries(itemsObj)
    .filter(([desc])=> !(ESTADO.excluidos && ESTADO.excluidos[chaveItem(mes,tipo,grupo,desc)]))
    .map(([desc,valor])=>{
      const key = chaveItem(mes,tipo,grupo,desc);
      const efetivo = ESTADO.overrides && ESTADO.overrides[key]!=null ? ESTADO.overrides[key] : valor;
      return {desc, valor: efetivo, fixo:true, ilustrativo: isReceitaIlustrativa(desc, mes)};
    });
  // Itens ilustrativos (ex.: Auxílio Transporte/Alimentação) aparecem no card, mas não contam
  // em total/falta/saldo — são só informativos.
  const itemsFixos = itemsFixosTodos.filter(it=>!it.ilustrativo);
  const itemsIlustrativos = itemsFixosTodos.filter(it=>it.ilustrativo);
  const itemsExtras = itensExtrasDoMes(mes, tipo, grupo).map(e=>({desc:e.desc, valor:e.valor, fixo:false, id:e.id, diaVencimento:e.diaVencimento}));
  const todos = [...itemsFixos, ...itemsExtras];
  const total = todos.reduce((a,i)=>a+i.valor,0);

  let confirmadosCount = 0, faltaSoma = 0;
  todos.forEach(it=>{
    const key = it.fixo ? chaveItem(mes,tipo,grupo,it.desc) : `extra:${it.id}`;
    if(ESTADO.confirmados[key]) confirmadosCount++;
    else faltaSoma += it.valor;
  });
  const labelFalta = tipo==='receita' ? 'Falta receber' : 'Falta pagar';
  const tudoFeito = confirmadosCount===todos.length;

  const icone = classe==='receitas' ? ICO.up : (classe==='debito' ? ICO.down : ICO.box);
  let html = `<div class="group ${classe}" data-tipo="${tipo}" data-grupo="${esc(grupo||'')}"><h3><span class="htitle">${icone}<span>${esc(titulo)}</span></span><span class="tot">${fmt(total)}</span></h3>`;
  if(notaDoGrupo(grupo)){
    html += `<div class="venc-note">${esc(notaDoGrupo(grupo))}</div>`;
  }
  if(todos.length===0){
    html += `<div class="empty-hint">Nada aqui este mês</div>`;
  } else {
    html += `<div class="falta-line ${tudoFeito?'ok':''}"><span>${tudoFeito?'✓ tudo confirmado':labelFalta+': '+brl(faltaSoma)}</span><span>${confirmadosCount} de ${todos.length}</span></div>`;
    html += `<div class="gprog-bar">${barraHtml(tudoFeito ? 100 : pctDe(total-faltaSoma, total))}</div>`;
    todos.forEach(it=>{
      const key = it.fixo ? chaveItem(mes,tipo,grupo,it.desc) : `extra:${it.id}`;
      const on = !!ESTADO.confirmados[key];
      const venc = it.fixo
        ? (tipo==='receita' ? vencimentoReceita(it.desc, mes) : vencimentoDespesa(it.desc, grupo, mes))
        : (it.diaVencimento!=null ? `${tipo==='receita'?'recebe':'vence'} dia ${it.diaVencimento}` : null);
      html += `<div class="citem ${on?'confirmado':''}" data-key="${esc(key)}" data-valor="${it.valor}"${it.fixo?'':` data-extra="${esc(it.id)}"`}>
        <button class="check ${on?'on':''}" data-acao="marcar" aria-pressed="${on}" aria-label="${on?'Desmarcar':'Confirmar'} ${esc(it.desc)}">${on?'✓':''}</button>
        <div class="ctext"><div class="cdesc">${esc(it.desc)}</div>${venc?`<div class="venc-tag">${esc(venc)}</div>`:''}</div>
        <div class="cval" data-acao="valor" title="Toque para alterar o valor deste mês">${fmt(it.valor)}</div>
        <button class="cdel" data-acao="remover" title="Remover deste mês" aria-label="Remover ${esc(it.desc)} deste mês">${ICO.trash}</button>
      </div>`;
    });
  }
  itemsIlustrativos.forEach(it=>{
    html += `<div class="citem ilustrativo">
      <div class="ctext"><div class="cdesc">${esc(it.desc)}</div><div class="venc-tag">apenas ilustrativo · não contabilizado</div></div>
      <div class="cval cval-ilustrativo">${fmt(it.valor)}</div>
    </div>`;
  });
  const sfx = `${sanit(mes)}-${sanit(tipo)}-${sanit(grupo||'x')}`;
  html += `<div class="add-row">
    <input class="din" placeholder="Novo item" aria-label="Descrição do novo item" id="add-desc-${sfx}">
    <input class="dval" placeholder="R$ 0,00" inputmode="decimal" aria-label="Valor" id="add-val-${sfx}">
    <input class="ddia" type="number" min="1" max="31" placeholder="Dia" aria-label="Dia do vencimento" id="add-dia-${sfx}">
    <button data-acao="adicionar" aria-label="Adicionar item">+</button>
  </div>`;
  html += `</div>`;
  return html;
}

// Um ouvinte só para a lista inteira: marcar, alterar valor, remover e adicionar.
(function(){
  const corpo = document.getElementById('confBody');
  corpo.addEventListener('click', (ev)=>{
    const alvo = ev.target.closest('[data-acao]');
    if(!alvo) return;
    const grupoEl = alvo.closest('.group');
    const mes = months[mesAtualIdx];
    if(alvo.dataset.acao==='adicionar'){ adicionarExtra(mes, grupoEl.dataset.tipo, grupoEl.dataset.grupo || null); return; }
    const item = alvo.closest('.citem');
    if(!item) return;
    const key = item.dataset.key;
    if(alvo.dataset.acao==='marcar') toggleConfirmado(key);
    else if(alvo.dataset.acao==='valor') iniciarEdicaoValor(alvo, key, parseFloat(item.dataset.valor));
    else if(alvo.dataset.acao==='remover'){
      if(!confirm(`Remover ${nomeDaChave(key)}?`)) return;
      if(item.dataset.extra) removerExtra(mes, item.dataset.extra); else excluirItemFixo(key);
    }
  });
  corpo.addEventListener('keydown', (ev)=>{
    if(ev.key!=='Enter' || !ev.target.closest('.add-row')) return;
    ev.preventDefault();
    const grupoEl = ev.target.closest('.group');
    adicionarExtra(months[mesAtualIdx], grupoEl.dataset.tipo, grupoEl.dataset.grupo || null);
  });
})();
function sanit(s){ return String(s).replace(/[^a-zA-Z0-9]/g,''); }

function toggleConfirmado(key){
  ESTADO.confirmados[key] = !ESTADO.confirmados[key];
  salvarEstado(`${ESTADO.confirmados[key]?"confirma":"desmarca"} ${nomeDaChave(key)}`);
  renderConfirmar();
}

function iniciarEdicaoValor(spanEl, key, valorAtual){
  if(spanEl.querySelector('input')) return; // ja em edicao
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'cval-input';
  input.value = fmt(valorAtual);
  spanEl.textContent = '';
  spanEl.appendChild(input);
  input.focus();
  input.select();
  let cancelado = false;
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter') input.blur();
    if(e.key==='Escape'){ cancelado = true; renderConfirmar(); }
  });
  input.addEventListener('blur', ()=>{
    if(cancelado) return;
    const novo = parseValor(input.value);
    if(!isNaN(novo) && novo>=0 && novo!==valorAtual){
      salvarValorEditado(key, novo);
    } else {
      renderConfirmar(); // sem mudanca (ou invalido) — volta como estava
    }
  });
}

function salvarValorEditado(key, novoValor){
  if(key.startsWith('extra:')){
    const id = key.slice(6);
    for(const mes in ESTADO.extras){
      const item = (ESTADO.extras[mes]||[]).find(e=>e.id===id);
      if(item){ item.valor = novoValor; break; }
    }
  } else {
    ESTADO.overrides[key] = novoValor;
  }
  salvarEstado(`altera ${nomeDaChave(key)} para ${brl(novoValor)}`);
  renderConfirmar();
}

// Entende "1.500,00", "1500,5", "1.500" (mil e quinhentos) e "12.50".
function parseValor(str){
  if(!str) return NaN;
  let limpo = String(str).replace(/[^\d,.-]/g,'');
  if(limpo.includes(',')) limpo = limpo.replace(/\./g,'').replace(',', '.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(limpo)) limpo = limpo.replace(/\./g,'');
  return parseFloat(limpo);
}

function adicionarExtra(mes, tipo, grupo){
  const descId = `add-desc-${sanit(mes)}-${sanit(tipo)}-${sanit(grupo||'x')}`;
  const valId = `add-val-${sanit(mes)}-${sanit(tipo)}-${sanit(grupo||'x')}`;
  const diaId = `add-dia-${sanit(mes)}-${sanit(tipo)}-${sanit(grupo||'x')}`;
  const descEl = document.getElementById(descId);
  const valEl = document.getElementById(valId);
  const diaEl = document.getElementById(diaId);
  const desc = descEl.value.trim();
  const valor = parseValor(valEl.value);
  const diaNum = parseInt(diaEl.value, 10);
  const diaVencimento = (!isNaN(diaNum) && diaNum>=1 && diaNum<=31) ? diaNum : null;
  if(!desc || isNaN(valor) || valor<=0){
    descEl.style.borderColor = !desc ? '#e5715f' : '';
    valEl.style.borderColor = (isNaN(valor)||valor<=0) ? '#e5715f' : '';
    return;
  }
  if(!ESTADO.extras[mes]) ESTADO.extras[mes]=[];
  ESTADO.extras[mes].push({ id: Date.now()+Math.random().toString(36).slice(2,7), tipo, grupo, desc, valor, diaVencimento });
  salvarEstado(`adiciona ${desc} ${brl(valor)} em ${mes}`);
  renderConfirmar();
}

function removerExtra(mes, id){
  const key = `extra:${id}`;
  const nomeRemovido = nomeDaChave(key);
  ESTADO.extras[mes] = (ESTADO.extras[mes]||[]).filter(e=>e.id!==id);
  if(!ESTADO.extras[mes].length) delete ESTADO.extras[mes];
  delete ESTADO.confirmados[key];
  salvarEstado(`remove ${nomeRemovido}`);
  renderConfirmar();
}

function excluirItemFixo(key){
  ESTADO.excluidos[key] = true;
  delete ESTADO.confirmados[key];
  delete ESTADO.overrides[key];
  salvarEstado(`remove ${nomeDaChave(key)}`);
  renderConfirmar();
}

/* =========================================================================
   VIEW: SIMULAÇÃO — os próximos anos com tudo o que está lançado, usando os
   mesmos números de "Meu Mês" (valores editados, itens removidos e avulsos).
   ========================================================================= */
let simulacaoRenderizada = false;
let anoAberto = null;
const __porAnoCache = {};
let __linhasSim = [];
let __simComCaixinhas = false;

function renderSimulacao(){
  if(simulacaoRenderizada) return;
  simulacaoRenderizada = true;

  let ajAcum = 0;
  __linhasSim = months.map((m, idx)=>{
    const s = monthStats[idx], aj = ajusteMesIdx(idx);
    ajAcum += aj.ajusteSaldo;
    return {
      receita: s.receita + aj.ajusteReceitas,
      despesa: s.debito + aj.ajusteDespesas,
      sobra: (s.saldo - s.aporteMensal) + aj.ajusteSaldo,
      cumulativo: s.saldoCumulativo + ajAcum,
    };
  });
  // A simulação de caixinhas (aporte mensal fixo rendendo CDI) só aparece se houver aporte configurado.
  __simComCaixinhas = monthStats.some(s=>s.aporteMensal>0);
  document.getElementById('simLede').textContent = 'Projeção com tudo o que está lançado, mês a mês, já contando o que você editou, removeu ou adicionou. Toque num ano para ver o detalhe.';

  const porAno = {};
  months.forEach((m, idx) => {
    const ano = anoDoLabel(m);
    if(!porAno[ano]) porAno[ano] = { receita:0, despesa:0, sobra:0, cumulativoFim:0, rendimentoTotal:0, aporteTotal:0, saldoFinalCaixinha:0, meses:0, idxs:[] };
    const a = porAno[ano], l = __linhasSim[idx], inv = investimentos[idx];
    a.receita += l.receita; a.despesa += l.despesa; a.sobra += l.sobra; a.cumulativoFim = l.cumulativo;
    a.rendimentoTotal += Object.values(inv.rendimento||{}).reduce((x,y)=>x+y,0);
    a.aporteTotal += monthStats[idx].aporte;
    a.saldoFinalCaixinha = monthStats[idx].saldoCaixinhaTotal;
    a.meses += 1;
    a.idxs.push(idx);
  });
  Object.assign(__porAnoCache, porAno);
  let htmlAnos='';
  Object.keys(porAno).sort().forEach(ano=>{
    const a = porAno[ano];
    htmlAnos += `<div class="year-card clickable" id="yc-${ano}" onclick="toggleAnoDetalhe(${ano})">
      <div class="ynum">${ano}${a.meses<12?` <span style="font-size:10px;color:var(--ink-faint);font-family:'Work Sans',sans-serif;">(${a.meses}m)</span>`:''}<span class="ychev">▾</span></div>
      <div class="yrow"><span class="ylabel">Receitas</span><span class="yval">${fmt(a.receita)}</span></div>
      <div class="yrow"><span class="ylabel">Despesas</span><span class="yval">${fmt(a.despesa)}</span></div>
      <div class="yrow"><span class="ylabel">Sobra</span><span class="yval" style="${a.sobra<0?'color:var(--rust)':''}">${(a.sobra<0?'−':'')+fmt(Math.abs(a.sobra))}</span></div>
      <div class="yrow"><span class="ylabel">Acumulado</span><span class="yval" style="${a.cumulativoFim<0?'color:var(--rust)':''}">${(a.cumulativoFim<0?'−':'')+fmt(Math.abs(a.cumulativoFim))}</span></div>
      ${__simComCaixinhas ? `<div class="yrow"><span class="ylabel">Caixinhas</span><span class="yval">${brl(a.saldoFinalCaixinha)}</span></div>
      <div class="yrow"><span class="ylabel">Rendimento</span><span class="yval rend">+${brl(a.rendimentoTotal)}</span></div>` : ''}
    </div>`;
  });
  document.getElementById('yearCards').innerHTML = htmlAnos;

  document.getElementById('marcosBloco').hidden = !__simComCaixinhas;
  if(!__simComCaixinhas){ document.getElementById('milestoneCards').innerHTML = ''; return; }
  const totalCaixinha = idx => monthStats[idx].saldoCaixinhaTotal;
  let idx250k=-1, idx500k=-1, idx1m=-1;
  for(let i=0;i<monthStats.length;i++){
    const t = totalCaixinha(i);
    if(idx250k===-1 && t>=250000) idx250k=i;
    if(idx500k===-1 && t>=500000) idx500k=i;
    if(idx1m===-1 && t>=1000000) idx1m=i;
  }
  const marcos = [
    { titulo:"R$250 mil", idx:idx250k },
    { titulo:"R$500 mil", idx:idx500k },
    { titulo:"R$1 milhão", idx:idx1m },
  ];
  let htmlMarcos='';
  marcos.forEach(mk=>{
    if(mk.idx<0){
      htmlMarcos += `<div class="year-card"><div class="ynum" style="color:var(--ink-faint); font-size:14px;">${mk.titulo}</div><div class="yrow"><span class="ylabel">Não atingido</span></div></div>`;
      return;
    }
    htmlMarcos += `<div class="year-card">
      <div class="ynum" style="font-size:15px;">${mk.titulo}</div>
      <div class="yrow"><span class="ylabel">Mês</span><span class="yval">${months[mk.idx]}</span></div>
      <div class="yrow"><span class="ylabel">Total</span><span class="yval rend">${brl(totalCaixinha(mk.idx))}</span></div>
    </div>`;
  });

/* ---- DESAFIO 40K ---- */
function taxaMensalCDI(){
  const anual = (viagemDesafio.cdiAnualPercent||14.15)/100;
  return Math.pow(1+anual, 1/12) - 1;
}

function recalcularDesafioPessoa(pessoa){
  const r = taxaMensalCDI();
  const N = pessoa.meses.length;
  const pesos = pessoa.meses.map((_,i)=>Math.pow(1+r, N-1-i));
  let somaPonderadaPreenchidos = 0, somaPesosVazios = 0, jaAportado = 0;
  const vaziosIdx = [];
  pessoa.meses.forEach((mes,i)=>{
    const v = pessoa.aportesRealizados[mes];
    if(v!==undefined && v!==null && v!==''){
      somaPonderadaPreenchidos += v*pesos[i];
      jaAportado += v;
    } else {
      somaPesosVazios += pesos[i];
      vaziosIdx.push(i);
    }
  });
  const metaSugerida = somaPesosVazios>0 ? Math.max(0,(pessoa.metaReais - somaPonderadaPreenchidos)/somaPesosVazios) : 0;

  let saldo=0;
  const acumulados = pessoa.meses.map((mes,i)=>{
    const v = pessoa.aportesRealizados[mes];
    const contrib = (v!==undefined && v!==null && v!=='') ? v : metaSugerida;
    saldo = saldo*(1+r) + contrib;
    return saldo;
  });

  pessoa.meses.forEach((mes,i)=>{
    const metaCell = document.getElementById(`metaCell-${pessoa.id}-${i}`);
    const acumCell = document.getElementById(`acumCell-${pessoa.id}-${i}`);
    const v = pessoa.aportesRealizados[mes];
    const preenchido = v!==undefined && v!==null && v!=='';
    if(metaCell) metaCell.textContent = preenchido ? '—' : ('R$ '+fmtEur(metaSugerida));
    if(acumCell) acumCell.textContent = 'R$ '+fmtEur(acumulados[i]);
  });

  const restante = Math.max(0, pessoa.metaReais - jaAportado);
  const rendimentoEstimado = pessoa.metaReais - jaAportado - (metaSugerida*vaziosIdx.length);
  const set = (id,txt)=>{ const el=document.getElementById(id); if(el) el.textContent=txt; };
  set(`resumoJaAportado-${pessoa.id}`, 'R$ '+fmtEur(jaAportado));
  set(`resumoRestante-${pessoa.id}`, 'R$ '+fmtEur(restante));
  set(`resumoSugerido-${pessoa.id}`, 'R$ '+fmtEur(metaSugerida));
  set(`resumoRendimento-${pessoa.id}`, 'R$ '+fmtEur(rendimentoEstimado));

  pessoa.__cache = { jaAportado, metaSugerida, vaziosCount: vaziosIdx.length, rendimentoEstimado };
  recalcularResumoCasal();
}

function recalcularResumoCasal(){
  let jaAportado=0, metaTotal=0, rendimento=0;
  viagemDesafio.pessoas.forEach(p=>{
    metaTotal += p.metaReais;
    if(p.__cache){ jaAportado += p.__cache.jaAportado; rendimento += p.__cache.rendimentoEstimado; }
  });
  const set = (id,txt)=>{ const el=document.getElementById(id); if(el) el.textContent=txt; };
  set('casalJaAportado', 'R$ '+fmtEur(jaAportado));
  set('casalMetaTotal', 'R$ '+fmtEur(metaTotal));
  set('casalRendimento', 'R$ '+fmtEur(rendimento));
}

function viagemAtualizarAporte(personId, mesIdx, value){
  const pessoa = viagemDesafio.pessoas.find(p=>p.id===personId);
  const mes = pessoa.meses[mesIdx];
  const s = String(value).trim();
  if(s===''){ delete pessoa.aportesRealizados[mes]; }
  else { const v = parseFloat(s.replace(',','.')); if(!isNaN(v)) pessoa.aportesRealizados[mes]=v; }
  recalcularDesafioPessoa(pessoa);
  salvarViagemDesafio();
}

function viagemAtualizarCdi(value){
  viagemDesafio.cdiAnualPercent = parseFloat(String(value).replace(',','.'))||14.15;
  viagemDesafio.pessoas.forEach(recalcularDesafioPessoa);
  salvarViagemDesafio();
}

  });
  document.getElementById('desafioPessoas').innerHTML = html;
  viagemDesafio.pessoas.forEach(recalcularDesafioPessoa);
