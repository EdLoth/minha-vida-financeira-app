const SEMANA_CURTA = ['dom','seg','ter','qua','qui','sex','sáb'];
function dataDoDia(mes, dia){ const [n, aa] = mes.split('/'); return new Date(2000+parseInt(aa,10), NOMES_MES_APP.indexOf(n), dia); }
const NOMES_MES_APP = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function hojeNoMes(mes){ const h = new Date(); return (NOMES_MES_APP[h.getMonth()]+'/'+String(h.getFullYear()%100).padStart(2,'0'))===mes ? h.getDate() : null; }
function comparaMesHoje(mes){ const h = new Date(); const [n, aa] = mes.split('/'); const a = (2000+parseInt(aa,10))*12 + NOMES_MES_APP.indexOf(n), b = h.getFullYear()*12 + h.getMonth(); return a<b ? -1 : (a>b ? 1 : 0); }
// Situação do item em relação a hoje: atrasado, hoje, em N dias.
function situacaoItem(mes, it){
  if(it.confirmado) return { cls:'', txt:'' };
  const cmp = comparaMesHoje(mes), verbo = it.tipo==='receita' ? 'receber' : 'pagar';
  if(cmp<0) return { cls:'atrasado', txt:`atrasado · era para ${verbo} dia ${it.dia}` };
  if(cmp>0) return { cls:'', txt:'' };
  const hoje = new Date().getDate(), dif = it.dia - hoje;
  if(dif<0) return { cls:'atrasado', txt:`atrasado há ${-dif} ${-dif===1?'dia':'dias'}` };
  if(dif===0) return { cls:'hoje', txt: it.tipo==='receita' ? 'entra hoje' : 'vence hoje' };
  if(dif<=3) return { cls:'', txt:`em ${dif} ${dif===1?'dia':'dias'}` };
  return { cls:'', txt:'' };
}

/* ---------- CHECKLIST: grupos com os itens em ordem de dia ---------- */
let filtroChecklist = 'todos';
function renderChecklist(mes, V){
  const contam = V.itens.filter(i=>!i.ilustrativo);
  const pend = contam.filter(i=>!i.confirmado).length, feitos = contam.length - pend;
  const atrasados = contam.filter(i=>situacaoItem(mes, i).cls==='atrasado').length;
  const filtros = [['todos','Todos', contam.length], ['pendentes','A pagar / receber', pend], ['feitos','Feitos', feitos]];
  document.getElementById('confFiltros').innerHTML = filtros.map(([k, n, q])=>`<button type="button" class="filtro" data-filtro="${k}" aria-pressed="${filtroChecklist===k}">${n}<b>${q}</b></button>`).join('');
  document.getElementById('accChecklistSub').innerHTML = `${feitos} de ${contam.length} feitos${atrasados ? ` · <span class="neg">${atrasados} ${atrasados===1?'atrasado':'atrasados'}</span>` : ''}`;
  let html = renderSecaoConfirmavel(mes, V, 'receita', null, 'Receitas', 'receitas');
  DADOS.grupos.forEach(g=>{ html += renderSecaoConfirmavel(mes, V, 'despesa', g.nome, g.nome, 'debito'); });
  document.getElementById('confBody').innerHTML = html;
}
document.getElementById('confFiltros').addEventListener('click', (ev)=>{
  const b = ev.target.closest('[data-filtro]'); if(!b) return;
  filtroChecklist = b.dataset.filtro; renderConfirmar();
});

function renderSecaoConfirmavel(mes, V, tipo, grupo, titulo, classe){
  const doGrupo = V.itens.filter(i=>i.tipo===tipo && (i.grupo||null)===(grupo||null));
  const ilustrativos = doGrupo.filter(i=>i.ilustrativo);
  const todos = doGrupo.filter(i=>!i.ilustrativo).sort((a,b)=> a.dia-b.dia || a.desc.localeCompare(b.desc,'pt-BR'));
  const total = todos.reduce((a,i)=>a+i.valor,0);
  const confirmadosCount = todos.filter(i=>i.confirmado).length;
  const faltaSoma = todos.filter(i=>!i.confirmado).reduce((a,i)=>a+i.valor,0);
  const labelFalta = tipo==='receita' ? 'Falta receber' : 'Falta pagar';
  const tudoFeito = confirmadosCount===todos.length;
  const visiveis = todos.filter(i=> filtroChecklist==='todos' || (filtroChecklist==='feitos' ? i.confirmado : !i.confirmado));

  const icone = classe==='receitas' ? ICO.up : (classe==='debito' ? ICO.down : ICO.box);
  let html = `<div class="group ${classe}" data-tipo="${tipo}" data-grupo="${esc(grupo||'')}"><h3><span class="htitle">${icone}<span>${esc(titulo)}</span></span><span class="tot">${fmt(total)}</span></h3>`;
  if(notaDoGrupo(grupo)) html += `<div class="venc-note">${esc(notaDoGrupo(grupo))}</div>`;
  html += cartaoDivisaoDoGrupo(mes, tipo, grupo);
  if(todos.length===0){
    html += `<div class="empty-hint">Nada aqui este mês</div>`;
  } else {
    html += `<div class="falta-line ${tudoFeito?'ok':''}"><span>${tudoFeito?'✓ tudo confirmado':labelFalta+': '+brl(faltaSoma)}</span><span>${confirmadosCount} de ${todos.length}</span></div>`;
    html += `<div class="gprog-bar">${barraHtml(tudoFeito ? 100 : pctDe(total-faltaSoma, total))}</div>`;
    visiveis.forEach(it=>{
      const on = it.confirmado, sit = situacaoItem(mes, it);
      const sem = it.diaOrigem==='padrao';
      const extras = [sit.txt ? `<span class="tag-status">${esc(sit.txt)}</span>` : '', it.vencimento ? esc(it.vencimento) : ''].filter(Boolean).join(' · ');
      html += `<div class="citem ${on?'confirmado':''} ${sit.cls}" data-key="${esc(it.chave)}" data-valor="${it.valor}"${it.origem==='avulso'?` data-extra="${esc(it.id)}"`:''}>
        <button class="check ${on?'on':''}" data-acao="marcar" aria-pressed="${on}" aria-label="${on?'Desmarcar':'Confirmar'} ${esc(it.desc)}">${on?'✓':''}</button>
        <div class="cdia ${sem?'semdata':''}" data-acao="editar" title="Toque para mudar a data"><b>${String(it.dia).padStart(2,'0')}</b><span>${SEMANA_CURTA[dataDoDia(mes, it.dia).getDay()]}</span></div>
        <div class="ctext" data-acao="editar" title="Toque para mudar nome, valor ou data"><div class="cdesc">${esc(it.desc)}${it.editado?'<span class="ctag">editado</span>':''}${it.podeSerAvulso ? `<button type="button" class="ctag-btn ${it.contaComoAvulso?'avulso':'despesa'}" data-acao="avulso" title="${it.contaComoAvulso?'Pago com o auxílio pessoal: não mexe em investimento e reserva. Toque para virar despesa.':'Despesa: diminui a sobra e recalcula investimento e reserva. Toque para pagar com o auxílio pessoal.'}">${it.contaComoAvulso?'auxílio':'despesa'}</button>` : ''}</div>${extras?`<div class="venc-tag">${extras}</div>`:''}</div>
        <div class="cval" data-acao="valor" title="Toque para alterar o valor deste mês">${fmt(it.valor)}</div>
        <button class="cdel" data-acao="remover" title="Remover deste mês" aria-label="Remover ${esc(it.desc)} deste mês">${ICO.trash}</button>
      </div>`;
    });
    const ocultos = todos.length - visiveis.length;
    if(ocultos>0) html += `<div class="group-oculto">${ocultos} ${ocultos===1?'item escondido':'itens escondidos'} pelo filtro</div>`;
  }
  ilustrativos.forEach(it=>{
    html += `<div class="citem ilustrativo">
      <div class="ctext"><div class="cdesc">${esc(it.desc)}</div><div class="venc-tag">apenas ilustrativo · não contabilizado</div></div>
      <div class="cval cval-ilustrativo">${fmt(it.valor)}</div>
    </div>`;
  });
  const sfx = `${sanit(mes)}-${sanit(tipo)}-${sanit(grupo||'x')}`;
  html += `<div class="add-row">
    <input class="din" placeholder="Novo item" aria-label="Descrição do novo item" id="add-desc-${sfx}">
    <input class="dval" placeholder="R$ 0,00" inputmode="decimal" aria-label="Valor" id="add-val-${sfx}">
    <input class="ddia" type="number" min="1" max="31" placeholder="Dia" aria-label="Dia do vencimento" id="add-dia-${sfx}">
    ${podeMarcarAvulso(mes, tipo, grupo) ? `<button type="button" class="avu-tog" data-acao="avulso-tog" id="add-avu-${sfx}" aria-pressed="${M.divisao.novasDespesasNoAvulso?'true':'false'}" title="Ligado: pago com o auxílio pessoal (não mexe em investimento e reserva). Desligado: despesa, recalcula investimento e reserva.">auxílio</button>` : ''}
    <button data-acao="adicionar" aria-label="Adicionar item">+</button>
  </div>`;
  html += `</div>`;
  return html;
}
// Item novo de despesa num mês com divisão da sobra, fora dos grupos de investimento e de avulsos.
function podeMarcarAvulso(mes, tipo, grupo){
  const div = M.divisao; if(!div || tipo!=='despesa' || grupo===div.grupo || grupo===div.grupoAvulsos) return false;
  const d = M.divisaoIdx(months.indexOf(mes)); return !!(d && d.ativa);
}
function alternarAvulso(mes, id){
  const e = (ESTADO.extras[mes]||[]).find(x=>x.id===id); if(!e) return;
  const it = M.visaoMes(mes).itens.find(i=>i.chave==='extra:'+id);
  e.avulso = !(it && it.contaComoAvulso);

}

/* =========================================================================
   FLUXO POR DIA — o saldo de cada dia do mês, para ver se o dinheiro dá
   ========================================================================= */
function renderFluxo(mes){
  const F = M.fluxoDoMes(mes);
  const el = document.getElementById('fluxoBody');
  const neg = F.diasNoVermelho.length;
  document.getElementById('accFluxoSub').innerHTML = neg
    ? `<span class="neg">${neg} ${neg===1?'dia':'dias'} sem dinheiro</span> · menor saldo ${brl(F.menor.valor)} no dia ${F.menor.dia}`
    : `<span class="ok">o dinheiro dá todos os dias</span> · menor saldo ${brl(F.menor.valor)}${F.menor.dia?` no dia ${F.menor.dia}`:''}`;
  if(!F.dias.length){ el.innerHTML = '<div class="empty-hint">Nada lançado neste mês</div>'; return; }

  const primeiroNeg = F.dias.find(d=>d.saldoFim<-0.004);
  let html = `<div class="fx-layout"><aside class="fx-lado"><div class="fx-resumo">
    <div class="fx-res"><div class="l">Começa com</div><div class="v ${F.saldoInicial<0?'neg':''}">${brl(F.saldoInicial)}</div><div class="s">acumulado até o mês anterior</div></div>
    <div class="fx-res"><div class="l">Menor saldo</div><div class="v ${F.menor.valor<0?'neg':''}">${brl(F.menor.valor)}</div><div class="s">${F.menor.dia?`dia ${F.menor.dia}`:'no começo do mês'}</div></div>
    <div class="fx-res"><div class="l">Termina com</div><div class="v ${F.saldoFinal<0?'neg':''}">${brl(F.saldoFinal)}</div><div class="s">dia ${F.ultimoDia}</div></div>
    <div class="fx-res"><div class="l">Dias sem dinheiro</div><div class="v ${neg?'neg':'ok'}">${neg||'nenhum'}</div><div class="s">${neg?`dias ${F.diasNoVermelho.join(', ')}`:'saldo positivo o mês todo'}</div></div>
  </div>`;
  if(primeiroNeg){
    html += `<div class="fx-alerta">No <b>dia ${primeiroNeg.dia}</b> o saldo fica em <b>${brl(primeiroNeg.saldoFim)}</b>. Para não faltar, troque a data de alguma conta (toque nela) para depois de um recebimento, ou separe esse dinheiro antes.</div>`;
  }
  html += `<div class="fx-grafico" id="fxGrafico"><div class="tit">Saldo ao fim de cada dia</div><div id="fxSvg"></div><div class="fx-tip" id="fxTip" hidden></div></div>`;
  html += roscaDoMesHtml(mes);
  html += `</aside><div class="fx-lista">`;
  html += `<div class="fx-legenda">${['rec','desp','inv','res'].map(c=>{ const k = TIPOS_FLUXO[c]; return `<span><span class="fx-ico ${c}">${k.ico}</span>${k.nome}</span>`; }).join('')}</div>`;

  const hoje = hojeNoMes(mes), cmp = comparaMesHoje(mes);
  let marcouHoje = false;
  F.dias.forEach(d=>{
    if(hoje!=null && !marcouHoje && d.dia>hoje){ html += `<div class="fx-hoje-marca">hoje, dia ${hoje}</div>`; marcouHoje = true; }
    const passado = cmp<0 || (hoje!=null && d.dia<hoje);
    html += `<div class="fx-dia ${d.saldoFim<-0.004?'neg':''} ${hoje===d.dia?'hoje':''} ${passado?'passado':''}">
      <div class="fx-data"><b>${String(d.dia).padStart(2,'0')}</b><span>${d.semana}</span></div>
      <div class="fx-card">${d.itens.map(i=>{ const k = tipoFluxo(i); return `<div class="fx-linha ${i.tipo} ${k.cls} ${i.confirmado?'feito':''}" data-key="${esc(i.chave)}">
          <button class="check ${i.confirmado?'on':''}" data-fx="marcar" aria-pressed="${i.confirmado}" aria-label="${i.confirmado?'Desmarcar':'Confirmar'} ${esc(i.desc)}">${i.confirmado?'✓':''}</button>
          <span class="fx-ico ${k.cls}" title="${k.nome}" aria-label="${k.nome}">${k.ico}</span>
          <div class="fx-txt" data-fx="editar" title="Toque para mudar nome, valor ou data"><div class="fx-desc">${esc(i.desc)}</div><div class="fx-grp">${esc(i.grupo || 'Receita')}${i.podeSerAvulso && i.contaComoAvulso?' · auxílio pessoal':''}${i.diaOrigem==='padrao'?' · sem data':''}${i.diaOrigem==='mes'?' · data só deste mês':''}</div></div>
          <div class="fx-val">${i.tipo==='receita'?'+':'−'}${fmt(i.valor)}</div>
        </div>`; }).join('')}
        <div class="fx-saldo"><span>${d.entradas?`entra ${brl(d.entradas)}`:''}${d.entradas&&d.saidas?' · ':''}${d.saidas?`sai ${brl(d.saidas)}`:''}</span><span>saldo do dia <b>${brl(d.saldoFim)}</b></span></div>
      </div>
    </div>`;
  });
  html += `</div></div>`;
  el.innerHTML = html;
  ligarRosca();
  __fluxoAtual = F;
  desenharGraficoFluxo();
}

/* Tipo de cada linha do fluxo: receita, despesa, investimento (investimento e sobra dos avulsos) ou reserva. */
const TIPOS_FLUXO = {
  rec: { cls:'rec', nome:'Receita', ico: ICO.up },
  desp: { cls:'desp', nome:'Despesa', ico: ICO.down },
  inv: { cls:'inv', nome:'Investimento', ico: ICO.invest },
  res: { cls:'res', nome:'Reserva', ico: ICO.escudo },
};
function tipoFluxo(i){
  if(i.tipo==='receita') return TIPOS_FLUXO.rec;
  if(i.regraId==='divisao-reserva') return TIPOS_FLUXO.res;
  if(i.regraId==='divisao-resto-avulsos') return (M.divisao && M.divisao.restoDestino==='reserva') ? TIPOS_FLUXO.res : TIPOS_FLUXO.inv;
  if(i.regraId==='divisao-investimento') return TIPOS_FLUXO.inv;
  return TIPOS_FLUXO.desp;
}

/* Gráfico do saldo dia a dia: uma linha só (degraus), azul acima de zero e vermelha abaixo.
   É desenhado na largura real do painel (sem esticar), e de novo quando o painel abre ou a tela muda. */
let __fluxoAtual = null;
function desenharGraficoFluxo(){
  const F = __fluxoAtual, alvo = document.getElementById('fxSvg');
  if(!F || !alvo) return;
  const W = Math.round(alvo.clientWidth);
  if(W < 50) return; // painel fechado: desenha quando abrir
  const H = 150, pl = 4, pr = 4, pt = 10, pb = 20, larg = W-pl-pr;
  const serie = []; let saldo = F.saldoInicial; const porDia = new Map(F.dias.map(d=>[d.dia, d]));
  for(let dia=1; dia<=F.ultimoDia; dia++){ if(porDia.has(dia)) saldo = porDia.get(dia).saldoFim; serie.push({ dia, saldo }); }
  const vals = serie.map(q=>q.saldo).concat([0, F.saldoInicial]);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(max-min < 1){ max += 1; min -= 1; }
  const folga = (max-min)*0.08; min -= folga; max += folga;
  const x = dia => pl + (dia-1)/(F.ultimoDia-1) * larg;
  const y = v => pt + (max-v)/(max-min) * (H-pt-pb);
  // pontos: o saldo ao fim de cada dia; a curva liga os dias suavemente sem passar dos valores reais
  const pts = serie.map(q=>[x(q.dia), y(q.saldo)]);
  const dPath = curvaMonotona(pts);
  const y0 = y(0);
  const area = `${dPath} L${pts[pts.length-1][0].toFixed(1)},${y0.toFixed(1)} L${pts[0][0].toFixed(1)},${y0.toFixed(1)} Z`;
  const marcas = [1, 5, 10, 15, 20, 25, F.ultimoDia].filter((v,i,a)=>a.indexOf(v)===i && (v===F.ultimoDia || F.ultimoDia-v>=3));
  const pontos = F.dias.map(d=>`<circle class="ponto" cx="${x(d.dia).toFixed(1)}" cy="${y(d.saldoFim).toFixed(1)}" r="4" style="stroke:${d.saldoFim<-0.004?'var(--rust)':'var(--navy)'}"></circle>`).join('');
  alvo.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo ao fim de cada dia: começa em ${brl(F.saldoInicial)}, menor saldo ${brl(F.menor.valor)}, termina em ${brl(F.saldoFinal)}">
    <defs>
      <linearGradient id="fxGradPos" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--navy)" stop-opacity="0.28"></stop><stop offset="1" stop-color="var(--navy)" stop-opacity="0"></stop></linearGradient>
      <linearGradient id="fxGradNeg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--rust)" stop-opacity="0.32"></stop><stop offset="1" stop-color="var(--rust)" stop-opacity="0.04"></stop></linearGradient>
      <clipPath id="fxAcima"><rect x="0" y="-20" width="${W}" height="${Math.max(0,y0+20)}"></rect></clipPath>
      <clipPath id="fxAbaixo"><rect x="0" y="${y0}" width="${W}" height="${Math.max(0,H-y0+20)}"></rect></clipPath>
    </defs>
    ${marcas.map(d=>`<line class="grade" x1="${x(d)}" x2="${x(d)}" y1="${pt}" y2="${H-pb}"></line><text class="eixo" x="${x(d)}" y="${H-5}" text-anchor="${d===1?'start':(d===F.ultimoDia?'end':'middle')}">${d}</text>`).join('')}
    <path class="area-pos" d="${area}" clip-path="url(#fxAcima)"></path>
    <path class="area-neg2" d="${area}" clip-path="url(#fxAbaixo)"></path>
    <line class="zero" x1="${pl}" x2="${W-pr}" y1="${y0}" y2="${y0}"></line>
    <path class="linha-pos" d="${dPath}" clip-path="url(#fxAcima)"></path>
    <path class="linha-neg" d="${dPath}" clip-path="url(#fxAbaixo)"></path>
    ${pontos}
    <line class="mira" id="fxMira" x1="0" x2="0" y1="${pt}" y2="${H-pb}" visibility="hidden"></line>
    <rect id="fxAlvo" x="0" y="0" width="${W}" height="${H}" fill="transparent"></rect>
  </svg>`;
  const svg = alvo.querySelector('svg'), tip = document.getElementById('fxTip'), mira = document.getElementById('fxMira'), box = document.getElementById('fxGrafico');
  const saldoNoDia = dia => { let v = F.saldoInicial; F.dias.forEach(d=>{ if(d.dia<=dia) v = d.saldoFim; }); return v; };
  const mostrar = (clientX)=>{
    const r = svg.getBoundingClientRect();
    const dia = Math.min(F.ultimoDia, Math.max(1, Math.round((clientX - r.left - pl)/larg*(F.ultimoDia-1)) + 1));
    mira.setAttribute('x1', x(dia)); mira.setAttribute('x2', x(dia)); mira.setAttribute('visibility', 'visible');
    const sd = saldoNoDia(dia), d = porDia.get(dia);
    tip.innerHTML = `Dia ${dia} · saldo <b class="${sd<0?'neg':''}">${brl(sd)}</b>${d?`<br>${d.entradas?`entra ${brl(d.entradas)}`:''}${d.entradas&&d.saidas?' · ':''}${d.saidas?`sai ${brl(d.saidas)}`:''}`:''}`;
    tip.hidden = false;
    const br = box.getBoundingClientRect();
    tip.style.left = Math.min(br.width-80, Math.max(80, r.left - br.left + x(dia))) + 'px';
    tip.style.top = (r.top - br.top + 4) + 'px';
  };
  const esconder = ()=>{ tip.hidden = true; mira.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('pointermove', e=>mostrar(e.clientX));
  svg.addEventListener('pointerdown', e=>mostrar(e.clientX));
  svg.addEventListener('pointerleave', esconder);
}
/* Curva monótona (Fritsch–Carlson): suave, mas nunca sobe acima nem desce abaixo dos pontos vizinhos. */
function curvaMonotona(pts){
  const n = pts.length; if(n<2) return '';
  const dx = [], dy = [], m = [];
  for(let i=0;i<n-1;i++){ dx[i] = pts[i+1][0]-pts[i][0]; dy[i] = pts[i+1][1]-pts[i][1]; m[i] = dy[i]/dx[i]; }
  const t = [m[0]];
  for(let i=1;i<n-1;i++) t[i] = (m[i-1]*m[i] <= 0) ? 0 : (m[i-1]+m[i])/2;
  t[n-1] = m[n-2];
  for(let i=0;i<n-1;i++){
    if(m[i]===0){ t[i] = 0; t[i+1] = 0; continue; }
    const a = t[i]/m[i], b = t[i+1]/m[i], h = a*a + b*b;
    if(h>9){ const k = 3/Math.sqrt(h); t[i] = k*a*m[i]; t[i+1] = k*b*m[i]; }
  }
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){
    const h = dx[i]/3;
    d += ` C${(pts[i][0]+h).toFixed(1)},${(pts[i][1]+t[i]*h).toFixed(1)} ${(pts[i+1][0]-h).toFixed(1)},${(pts[i+1][1]-t[i+1]*h).toFixed(1)} ${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`;
  }
  return d;
}

/* ---------- rosca: para onde vai o dinheiro que sai no mês ----------
   Fatias em ordem fixa, cada uma com a sua cor (validada para daltonismo no fundo escuro):
   Cartões, Pessoal, Isis, Investimento, Reserva, Avulsos. Somam as despesas do mês. */
const CORES_ROSCA = { g0:'#338ced', g2:'#e76624', g1:'#9887ef', inv:'#00a888', res:'#d28e05', avu:'#e24d8b', outros:'#8a8a93' };
function fatiasDoMes(mes){
  const V = M.visaoMes(mes), div = M.divisao;
  const especiais = div ? [div.grupo, div.grupoAvulsos] : [];
  const comuns = DADOS.grupos.map(g=>g.nome).filter(n=>!especiais.includes(n));
  const soma = filtro => reais2(V.itens.filter(i=>!i.ilustrativo && i.tipo==='despesa' && filtro(i)).reduce((t,i)=>t+i.valor,0));
  const fatias = [];
  const cor = idx => idx===0 ? CORES_ROSCA.g0 : (idx===1 ? CORES_ROSCA.g1 : (idx===2 ? CORES_ROSCA.g2 : CORES_ROSCA.outros));
  // ordem de exibição: 1º, 3º, 2º grupo (separa as cores parecidas), depois os demais
  const ordem = [0, 2, 1].filter(i=>i<comuns.length).concat(comuns.map((_,i)=>i).filter(i=>i>2));
  const outros = soma(i=>comuns.indexOf(i.grupo)>2);
  ordem.forEach(idx=>{
    if(idx>2) return;
    const v = soma(i=>i.grupo===comuns[idx]); if(v>0.004) fatias.push({ nome: comuns[idx], valor: v, cor: cor(idx) });
  });
  if(outros>0.004) fatias.push({ nome:'Outros grupos', valor: outros, cor: CORES_ROSCA.outros });
  if(div){
    const vaiPraReserva = i => i.regraId==='divisao-reserva' || (i.regraId==='divisao-resto-avulsos' && div.restoDestino==='reserva');
    const inv = soma(i=>i.grupo===div.grupo && !vaiPraReserva(i));
    const res = soma(i=>i.grupo===div.grupo && vaiPraReserva(i));
    const avu = soma(i=>i.grupo===div.grupoAvulsos);
    if(inv>0.004) fatias.push({ nome:'Investimento', valor: inv, cor: CORES_ROSCA.inv });
    if(res>0.004) fatias.push({ nome:'Reserva', valor: res, cor: CORES_ROSCA.res });
    if(avu>0.004) fatias.push({ nome:'Auxílio pessoal (gasto)', valor: avu, cor: CORES_ROSCA.avu });
  }
  return fatias;
}
function roscaDoMesHtml(mes){
  const fatias = fatiasDoMes(mes);
  const total = fatias.reduce((t,f)=>t+f.valor,0);
  if(total<=0) return '';
  const R = 70, r = 46, c = 75;
  let ang = -Math.PI/2;
  const arcos = fatias.map((f, i)=>{
    const a0 = ang, a1 = ang + (f.valor/total)*Math.PI*2; ang = a1;
    const grande = (a1-a0) > Math.PI ? 1 : 0;
    const P = (rad, a) => `${(c + rad*Math.cos(a)).toFixed(2)},${(c + rad*Math.sin(a)).toFixed(2)}`;
    const d = fatias.length===1
      ? `M${c},${c-R} A${R},${R} 0 1 1 ${c-0.01},${c-R} L${c-0.01},${c-r} A${r},${r} 0 1 0 ${c},${c-r} Z`
      : `M${P(R,a0)} A${R},${R} 0 ${grande} 1 ${P(R,a1)} L${P(r,a1)} A${r},${r} 0 ${grande} 0 ${P(r,a0)} Z`;
    return `<path d="${d}" fill="${f.cor}" data-fatia="${i}"><title>${esc(f.nome)}: ${brl(f.valor)} (${pctTxt(f.valor/total*100)})</title></path>`;
  }).join('');
  return `<div class="rosca" id="fxRosca">
    <div class="tit">Para onde vai o dinheiro do mês</div>
    <div class="rosca-corpo">
      <div class="rosca-svg"><svg viewBox="0 0 150 150" role="img" aria-label="Divisão das saídas do mês">${arcos}</svg>
        <div class="rosca-centro" id="roscaCentro"><small>saídas do mês</small><b>${brl(total)}</b></div></div>
      <div class="rosca-lista">${fatias.map((f,i)=>`<div class="rosca-item" data-fatia="${i}"><i style="background:${f.cor}"></i><span>${esc(f.nome)}</span><b>${brl(f.valor)}</b><em>${pctTxt(f.valor/total*100)}</em></div>`).join('')}</div>
    </div>
  </div>`;
}
// Tocar/passar numa fatia ou na linha da lista destaca as duas e mostra o valor no centro.

/* ---------- editar nome, valor e data de um item do mês ---------- */
function formItemDoMes(key){
  const mes = months[mesAtualIdx];
  const it = M.visaoMes(mes).itens.find(i=>i.chave===key);
  if(!it) return;
  const regra = it.origem==='regra' ? DADOS.lancamentos.find(r=>r.id===it.regraId) : null;
  const extra = it.origem==='avulso' ? (ESTADO.extras[mes]||[]).find(e=>e.id===it.id) : null;
  const podeRenomear = !!(extra || (regra && !it.gerado));
  const nomeAtual = extra ? extra.desc : (regra ? regra.desc : it.desc);
  const ehModelo = !!(regra && /\{(n|total|ultima|ref)\}/.test(regra.desc));
  const ehRegraComum = !!(regra && !it.gerado);
  abrirSheet({
    titulo: 'Editar item',
    corpo: `
      <label class="campo"><span>Nome${ehRegraComum ? ' <em>(muda em todos os meses)</em>' : ''}</span><input id="fi-nome" maxlength="80" value="${esc(nomeAtual)}" ${podeRenomear?'data-foco':'disabled'}></label>
      ${ehModelo ? '<p class="sheet-dica">Parcelado: {n} vira o número da parcela, {total} o total e {ultima} o aviso da última. Neste mês aparece como "'+esc(it.desc)+'".</p>' : ''}
      ${it.gerado ? '<p class="sheet-dica">Este item é calculado pela divisão da sobra, então o nome é fixo. A data e o valor podem mudar só neste mês.</p>' : ''}
      <div class="campo-linha">
        <label class="campo"><span>Valor <em>(${extra?'deste item':'só neste mês'})</em></span><input id="fi-valor" class="num" inputmode="decimal" value="${fmt(it.valor)}"></label>
        <label class="campo"><span>Dia</span><input id="fi-dia" class="num" inputmode="numeric" maxlength="2" value="${it.dia}" ${podeRenomear?'':'data-foco'}></label>
      </div>
      ${ehRegraComum ? `<label class="check-linha"><input type="checkbox" id="fi-todos" ${it.diaOrigem==='padrao'?'checked':''}> Usar este dia em todos os meses</label>` : ''}
      ${it.diaOrigem==='padrao' ? '<p class="sheet-dica">Este item não tinha data, por isso estava contando no dia 1.</p>' : ''}
      ${it.podeSerAvulso ? `<label class="check-linha"><input type="checkbox" id="fi-avulso" ${it.contaComoAvulso?'checked':''}> Pago com o auxílio pessoal (não mexe em investimento e reserva)</label>
      <p class="sheet-dica">Desmarcado, é uma despesa: diminui a sobra do mês e recalcula investimento, reserva e sobra do auxílio.</p>` : ''}`,
    salvar: ()=>{
      const v = k=>document.getElementById(k).value.trim();
      const nome = v('fi-nome'), valor = parseValor(v('fi-valor')), dia = parseInt(v('fi-dia'),10);
      if(!nome) return 'Dê um nome.';
      if(isNaN(valor) || valor<0) return 'O valor precisa ser um número em reais.';
      if(!(dia>=1 && dia<=31)) return 'O dia precisa ser de 1 a 31.';
      const mudou = [];
      if(extra){
        if(nome!==extra.desc){ extra.desc = nome; mudou.push('nome'); }
        if(Math.abs(valor-extra.valor)>0.004){ extra.valor = reais2(valor); mudou.push('valor'); }
        if(dia!==extra.diaVencimento){ extra.diaVencimento = dia; mudou.push('dia'); }
        const avuEl = document.getElementById('fi-avulso');
        if(avuEl && avuEl.checked!==it.contaComoAvulso){ extra.avulso = avuEl.checked; mudou.push(avuEl.checked ? 'pago com o auxílio pessoal' : 'vira despesa'); }
        if(!mudou.length) return null;
        gravar(`altera ${nome} (${mes}): ${mudou.join(', ')}`);
        renderConfirmar(); return null;
      }
      let chave = key;
      if(regra && !it.gerado && nome!==regra.desc){
        const antes = regra.desc;
        Motor.renomearRegra(DADOS, regra.id, nome);
        const erros = Motor.validar(DADOS).filter(p=>p.nivel==='erro');
        if(erros.length){ Motor.renomearRegra(DADOS, regra.id, antes); recalcularMotor(); return erros[0].msg; }
        recalcularMotor();
        const novo = M.visaoMes(mes).itens.find(i=>i.regraId===regra.id);
        if(novo) chave = novo.chave;
        mudou.push('nome');
      }
      if(Math.abs(valor-it.valor)>0.004){ ESTADO.overrides[chave] = reais2(valor); mudou.push('valor'); }
      const todos = !!(document.getElementById('fi-todos') && document.getElementById('fi-todos').checked);
      if(regra && !it.gerado && todos){
        if(regra.dia!==dia || regra.diaUtil || regra.ultimoDiaAte){
          regra.dia = dia; delete regra.diaUtil; delete regra.ultimoDiaAte;
          mudou.push('dia em todos os meses');
        }
        Object.keys(ESTADO.dias).forEach(k=>{ const i2 = M.info[k.split('|')[0]] && M.info[k.split('|')[0]][k]; if(i2 && i2.regraId===regra.id) delete ESTADO.dias[k]; });
      } else if(dia!==it.dia){
        const natural = it.diaRegra!=null ? it.diaRegra : null;
        if(natural===dia) delete ESTADO.dias[chave]; else ESTADO.dias[chave] = dia;
        mudou.push('dia');
      }
      if(!mudou.length) return null;
      gravar(`altera ${nome.replace(/\{[^}]*\}/g,'').trim()} (${mes}): ${mudou.join(', ')}`);
      renderConfirmar(); return null;
    },
    excluir: ()=>{
      if(!confirm(`Remover ${it.desc} deste mês?`)) return false;
      if(extra) removerExtra(mes, extra.id); else excluirItemFixo(key);
      return null;
    },
    rotuloExcluir: 'Remover deste mês',
  });
}

function pctsDivisao(k){ const d = M.divisao; if(!d) return ''; return d.mudanca && d.mudanca[k]!==d[k] ? `${d[k]}% → ${d.mudanca[k]}%` : `${d[k]}%`; }
function textoMudancaReserva(){ const d = M.divisao; if(!d || !d.mudanca) return ''; return ` Quando a reserva chegar a ${brl(d.mudanca.valor)}${d.mudancaEm ? ` (previsto para ${d.mudancaEm})` : ''}, passa a ser ${d.mudanca.investimento}% investimento e ${d.mudanca.reserva}% reserva.`; }
function destResto(){ return (M.divisao && M.divisao.restoDestino==='reserva') ? 'a reserva' : 'o investimento'; }
function pctTxt(v){ return (Math.round(v*10)/10).toLocaleString('pt-BR') + '%'; }
/* Divisão da sobra: no grupo de investimento mostra como a sobra foi dividida; no grupo de avulsos
   mostra o orçamento do mês (o que resta da sobra) contra o que já foi gasto. */
function cartaoDivisaoDoGrupo(mes, tipo, grupo){
  const div = M.divisao;
  if(!div || tipo!=='despesa' || (grupo!==div.grupo && grupo!==div.grupoAvulsos)) return '';
  const d = M.divisaoIdx(months.indexOf(mes));
  if(!d || !d.ativa) return grupo===div.grupoAvulsos || grupo===div.grupo
    ? `<div class="orc"><div class="orc-sub"><span>A divisão da sobra começa em ${esc(div.desde)}.</span></div></div>` : '';
  if(d.sobra<=0) return `<div class="orc estourou"><div class="orc-sub"><span>Este mês não sobra nada (${brl(d.sobra)}), então não há investimento, reserva nem auxílio pessoal.</span></div></div>`;
  if(grupo===div.grupo){
    const p = d.pct;
    return `<div class="orc">
      <div class="orc-top"><span>Sobra do mês</span><b>${brl(d.sobra)}</b></div>
      <div class="div-bar"><i class="inv" style="width:${(d.pctEfetivo||p).investimento}%"></i><i class="res" style="width:${(d.pctEfetivo||p).reserva}%"></i><i class="avu" style="width:${(d.pctEfetivo||p).avulsos}%"></i></div>
      <div class="div-leg"><span class="inv">Investimento ${pctTxt((d.pctEfetivo||p).investimento)} <b>${brl(d.investimento)}</b></span><span class="res">Reserva ${pctTxt((d.pctEfetivo||p).reserva)} <b>${brl(d.reserva)}</b></span><span class="avu">Auxílio ${pctTxt((d.pctEfetivo||p).avulsos)} <b>${brl(d.orcamentoAvulsos)}</b></span></div>
      ${d.excessoAvulsos>0 ? `<div class="orc-sub" style="margin-top:6px;"><span>O auxílio pessoal tem teto de ${brl(d.teto)}${M.divisao.prioridade ? ' e nunca passa do investimento nem da reserva' : ''}; os ${brl(d.excessoAvulsos)} que passaram foram para investimento e reserva</span></div>` : ''}
      ${div.restoParaInvestimento ? `<div class="orc-sub" style="margin-top:6px;"><span>O que não for gasto do auxílio vai para ${destResto()}</span><span>hoje <b>${brl(d.restoParaInvestimento||0)}</b></span></div>` : ''}
    </div>`;
  }
  const estourou = d.gastoAvulsos > d.orcamentoAvulsos + 0.004;
  const pct = d.orcamentoAvulsos>0 ? Math.min(100, d.gastoAvulsos/d.orcamentoAvulsos*100) : (d.gastoAvulsos>0?100:0);
  return `<div class="orc ${estourou?'estourou':''}">
    <div class="orc-top"><span>Gasto <b>${brl(d.gastoAvulsos)}</b></span><span>de <b>${brl(d.orcamentoAvulsos)}</b></span></div>
    <div class="orc-bar">${barraHtml(pct)}</div>
    ${d.gastoOutrosGrupos>0.004 ? `<div class="orc-sub" style="margin-bottom:4px;"><span>Inclui ${brl(d.gastoOutrosGrupos)} de itens novos lançados em outros grupos</span></div>` : ''}
    <div class="orc-sub"><span>orçamento = ${d.pct.avulsos.toLocaleString('pt-BR')}% da sobra do mês${d.teto!=null ? `, no máximo ${brl(d.teto)}` : ''}${div.restoParaInvestimento && !estourou ? ` · o que restar vai para ${destResto()}` : ''}</span><span>${estourou ? `passou <b>${brl(-d.restanteAvulsos)}</b>` : `restam <b>${brl(d.restanteAvulsos)}</b>`}</span></div>
  </div>`;
}

function sanit(s){ return String(s).replace(/[^a-zA-Z0-9]/g,''); }

function toggleConfirmado(key){
  ESTADO.confirmados[key] = !ESTADO.confirmados[key];
  salvarEstado(`${ESTADO.confirmados[key]?"confirma":"desmarca"} ${nomeDaChave(key)}`);
  renderConfirmar();
}

function iniciarEdicaoValor(spanEl, key, valorAtual){
  if(spanEl.querySelector('input')) return; // ja em edicao
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'cval-input';
  input.value = fmt(valorAtual);
  spanEl.textContent = '';
  spanEl.appendChild(input);
  input.focus();
  input.select();
  let cancelado = false;
  input.addEventListener('keydown', (e)=>{
    if(e.key==='Enter') input.blur();
    if(e.key==='Escape'){ cancelado = true; renderConfirmar(); }
  });
  input.addEventListener('blur', ()=>{
    if(cancelado) return;
    const novo = parseValor(input.value);
    if(!isNaN(novo) && novo>=0 && novo!==valorAtual){
      salvarValorEditado(key, novo);
    } else {
      renderConfirmar(); // sem mudanca (ou invalido) — volta como estava
    }
  });
}

function salvarValorEditado(key, novoValor){
  if(key.startsWith('extra:')){
    const id = key.slice(6);
    for(const mes in ESTADO.extras){
      const item = (ESTADO.extras[mes]||[]).find(e=>e.id===id);
      if(item){ item.valor = novoValor; break; }
    }
  } else {
    ESTADO.overrides[key] = novoValor;
  }
  salvarEstado(`altera ${nomeDaChave(key)} para ${brl(novoValor)}`);
  renderConfirmar();
}

// Entende "1.500,00", "1500,5", "1.500" (mil e quinhentos) e "12.50".
function parseValor(str){
  if(!str) return NaN;
  let limpo = String(str).replace(/[^\d,.-]/g,'');
  if(limpo.includes(',')) limpo = limpo.replace(/\./g,'').replace(',', '.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(limpo)) limpo = limpo.replace(/\./g,'');
  return parseFloat(limpo);
}

function adicionarExtra(mes, tipo, grupo){
  const descId = `add-desc-${sanit(mes)}-${sanit(tipo)}-${sanit(grupo||'x')}`;
  const valId = `add-val-${sanit(mes)}-${sanit(tipo)}-${sanit(grupo||'x')}`;
  const diaId = `add-dia-${sanit(mes)}-${sanit(tipo)}-${sanit(grupo||'x')}`;
  const descEl = document.getElementById(descId);
  const valEl = document.getElementById(valId);
  const diaEl = document.getElementById(diaId);
  const desc = descEl.value.trim();
  const valor = parseValor(valEl.value);
  const diaNum = parseInt(diaEl.value, 10);
  const diaVencimento = (!isNaN(diaNum) && diaNum>=1 && diaNum<=31) ? diaNum : null;
  if(!desc || isNaN(valor) || valor<=0){
    descEl.style.borderColor = !desc ? '#e5715f' : '';
    valEl.style.borderColor = (isNaN(valor)||valor<=0) ? '#e5715f' : '';
    return;
  }
  if(!ESTADO.extras[mes]) ESTADO.extras[mes]=[];
  const novo = { id: Date.now()+Math.random().toString(36).slice(2,7), tipo, grupo, desc, valor, diaVencimento };
  const avuEl = document.getElementById(`add-avu-${sanit(mes)}-${sanit(tipo)}-${sanit(grupo||'x')}`);
  if(avuEl) novo.avulso = avuEl.getAttribute('aria-pressed')==='true';
  ESTADO.extras[mes].push(novo);
  salvarEstado(`adiciona ${desc} ${brl(valor)} em ${mes}`);
  renderConfirmar();
}

function removerExtra(mes, id){
  const key = `extra:${id}`;
  const nomeRemovido = nomeDaChave(key);
  ESTADO.extras[mes] = (ESTADO.extras[mes]||[]).filter(e=>e.id!==id);
  if(!ESTADO.extras[mes].length) delete ESTADO.extras[mes];
  delete ESTADO.confirmados[key];
  salvarEstado(`remove ${nomeRemovido}`);
  renderConfirmar();
}

function excluirItemFixo(key){
  ESTADO.excluidos[key] = true;
  delete ESTADO.confirmados[key];
  delete ESTADO.overrides[key];
  salvarEstado(`remove ${nomeDaChave(key)}`);
  renderConfirmar();
}

/* =========================================================================
   VIEW: SIMULAÇÃO — os próximos anos com tudo o que está lançado, usando os
   mesmos números de "Meu Mês" (valores editados, itens removidos e avulsos).
   ========================================================================= */
let simulacaoRenderizada = false;
let anoAberto = null;
const __porAnoCache = {};
let __linhasSim = [];
let __simComCaixinhas = false;

function renderSimulacao(){
  if(simulacaoRenderizada) return;
  simulacaoRenderizada = true;

  let ajAcum = 0;
  __linhasSim = months.map((m, idx)=>{
    const s = monthStats[idx], aj = ajusteMesIdx(idx);
    ajAcum += aj.ajusteSaldo;
    return {
      receita: s.receita + aj.ajusteReceitas,
      despesa: s.debito + aj.ajusteDespesas - (s.aporteDaSobra||0),
      sobra: (s.saldo - s.aporteMensal) + aj.ajusteSaldo + (s.aporteDaSobra||0),
      cumulativo: s.saldoCumulativo + ajAcum,
    };
  });
  // A simulação de caixinhas (aporte fixo e/ou % da sobra rendendo CDI) só aparece se houver aporte configurado.
  __simComCaixinhas = monthStats.some(s=>s.aporte>0);
  const dvSim = M.divisao;
  const regraAporte = dvSim ? (dvSim.restoParaInvestimento
    ? ` A partir de ${dvSim.desde}, a sobra de cada mês vai ${dvSim.investimento}% para investimento, ${dvSim.reserva}% para a reserva e ${dvSim.avulsos.toLocaleString('pt-BR')}% para o auxílio pessoal${dvSim.tetoAvulsos!=null?` (no máximo ${brl(dvSim.tetoAvulsos)})`:''}; o que não for gasto do auxílio vai para ${destResto()}. Investimento e reserva vão para as caixinhas.`
    : ` A partir de ${dvSim.desde}, o investimento (${dvSim.investimento}%) e a reserva (${dvSim.reserva}%) da sobra de cada mês vão para as caixinhas.`) : '';
  const notaSim = dvSim ? ' Despesas e sobra são antes de investir e reservar; o acumulado é o que fica na conta.' : '';
  document.getElementById('simLede').textContent = 'Projeção com tudo o que está lançado, mês a mês, já contando o que você editou, removeu ou adicionou.' + regraAporte + textoMudancaReserva() + notaSim + ' Toque num ano para ver o detalhe.';

  const porAno = {};
  const anoMinSim = dvSim ? 2000 + parseInt(dvSim.desde.slice(4), 10) : -Infinity; // meses antes da divisão só entram no acumulado
  months.forEach((m, idx) => {
    const ano = anoDoLabel(m);
    if(Number(ano) < anoMinSim) return;
    if(!porAno[ano]) porAno[ano] = { receita:0, despesa:0, sobra:0, cumulativoFim:0, rendimentoTotal:0, aporteTotal:0, saldoFinalCaixinha:0, meses:0, idxs:[] };
    const a = porAno[ano], l = __linhasSim[idx], inv = investimentos[idx];
    a.receita += l.receita; a.despesa += l.despesa; a.sobra += l.sobra; a.cumulativoFim = l.cumulativo;
    a.rendimentoTotal += Object.values(inv.rendimento||{}).reduce((x,y)=>x+y,0);
    a.aporteTotal += monthStats[idx].aporte;
    a.saldoFinalCaixinha = monthStats[idx].saldoCaixinhaTotal;
    a.meses += 1;
    a.idxs.push(idx);
  });
  Object.assign(__porAnoCache, porAno);
  let htmlAnos='';
  Object.keys(porAno).sort().forEach(ano=>{
    const a = porAno[ano];
    htmlAnos += `<div class="year-card clickable" id="yc-${ano}" onclick="toggleAnoDetalhe(${ano})">
      <div class="ynum">${ano}${a.meses<12?` <span style="font-size:10px;color:var(--ink-faint);font-family:'Work Sans',sans-serif;">(${a.meses}m)</span>`:''}<span class="ychev">▾</span></div>
      <div class="yrow"><span class="ylabel">Receitas</span><span class="yval">${fmt(a.receita)}</span></div>
      <div class="yrow"><span class="ylabel">Despesas</span><span class="yval">${fmt(a.despesa)}</span></div>
      <div class="yrow"><span class="ylabel">Sobra</span><span class="yval" style="${a.sobra<0?'color:var(--rust)':''}">${(a.sobra<0?'−':'')+fmt(Math.abs(a.sobra))}</span></div>
      <div class="yrow"><span class="ylabel">Acumulado</span><span class="yval" style="${a.cumulativoFim<0?'color:var(--rust)':''}">${(a.cumulativoFim<0?'−':'')+fmt(Math.abs(a.cumulativoFim))}</span></div>
      ${dvSim ? (()=>{ const mt = M.metasDoAno(Number(ano), null); return `<div class="yrow"><span class="ylabel">Investimento ${pctsDivisao('investimento')}</span><span class="yval" style="color:var(--teal)">${fmt(mt.investimento.meta)}</span></div>
      <div class="yrow"><span class="ylabel">Reserva ${pctsDivisao('reserva')}</span><span class="yval" style="color:var(--amber)">${fmt(mt.reserva.meta)}</span></div>${mt.restoParaInvestimento ? `
      <div class="yrow"><span class="ylabel">Sobra do auxílio</span><span class="yval" style="color:var(--teal)">${fmt(mt.restoAvulsos.meta)}</span></div>` : ''}`; })() : ''}
      ${__simComCaixinhas ? `<div class="yrow"><span class="ylabel">Caixinhas</span><span class="yval">${brl(a.saldoFinalCaixinha)}</span></div>
      <div class="yrow"><span class="ylabel">Rendimento</span><span class="yval rend">+${brl(a.rendimentoTotal)}</span></div>` : ''}
    </div>`;
  });
  document.getElementById('yearCards').innerHTML = htmlAnos;

  document.getElementById('marcosBloco').hidden = !__simComCaixinhas;
  if(!__simComCaixinhas){ document.getElementById('milestoneCards').innerHTML = ''; return; }
  const totalCaixinha = idx => monthStats[idx].saldoCaixinhaTotal;
  let idx250k=-1, idx500k=-1, idx1m=-1;
  for(let i=0;i<monthStats.length;i++){
    const t = totalCaixinha(i);
    if(idx250k===-1 && t>=250000) idx250k=i;
    if(idx500k===-1 && t>=500000) idx500k=i;
    if(idx1m===-1 && t>=1000000) idx1m=i;
  }
  const marcos = [
    { titulo:"R$250 mil", idx:idx250k },
    { titulo:"R$500 mil", idx:idx500k },
    { titulo:"R$1 milhão", idx:idx1m },
  ];
  let htmlMarcos='';
  marcos.forEach(mk=>{
    if(mk.idx<0){
      htmlMarcos += `<div class="year-card"><div class="ynum" style="color:var(--ink-faint); font-size:14px;">${mk.titulo}</div><div class="yrow"><span class="ylabel">Não atingido</span></div></div>`;
      return;
    }
    htmlMarcos += `<div class="year-card">
      <div class="ynum" style="font-size:15px;">${mk.titulo}</div>
      <div class="yrow"><span class="ylabel">Mês</span><span class="yval">${months[mk.idx]}</span></div>
      <div class="yrow"><span class="ylabel">Total</span><span class="yval rend">${brl(totalCaixinha(mk.idx))}</span></div>
    </div>`;
  });
  document.getElementById('milestoneCards').innerHTML = htmlMarcos;
}

function toggleAnoDetalhe(ano){
  anoAberto = (anoAberto === ano) ? null : ano;
  document.querySelectorAll('.year-card.clickable').forEach(el=>{
    el.classList.toggle('open', el.id === `yc-${anoAberto}`);
  });
  renderAnoDetalhe();
}

function renderAnoDetalhe(){
  const box = document.getElementById('yearDetalhe');
  if(!box) return;
  if(anoAberto == null){ box.classList.remove('open'); box.innerHTML=''; return; }
  const a = __porAnoCache[anoAberto];
  if(!a){ box.classList.remove('open'); box.innerHTML=''; return; }

  const idxs = a.idxs;
  const saldoIni = idxs[0]>0 ? __linhasSim[idxs[0]-1].cumulativo : 0;
  const iHoje = idxDeHoje();

  let rows = '';
  idxs.forEach(idx=>{
    const l = __linhasSim[idx];
    let extras = '';
    if(__simComCaixinhas){
      const stat = monthStats[idx];
      const inv = investimentos[idx];
      const rendMes = Object.values(inv.rendimento||{}).reduce((x,y)=>x+y,0);
      const alocEntries = Object.entries(inv.alocacao||{});
      const alocTxt = alocEntries.length ? alocEntries.map(([k])=>`${k.replace(' CDI','%').replace('100%','100% CDI')}`).join(' · ') : '—';
      const alocFull = alocEntries.length ? alocEntries.map(([k,v])=>`${k}: ${brl(v)}`).join(' · ') : '—';
      const rendKeys = Object.keys(inv.rendimento||{});
      const rendTxt = rendKeys.length ? rendKeys.map(k=>`${k}: +${brl(inv.rendimento[k])}`).join(' · ') : '—';
      extras = `<td class="money">${stat.aporte>0?brl(stat.aporte):'—'}</td>
      <td class="conquista-col" title="${alocFull}">${alocTxt}</td>
      <td class="conquista-col" style="color:var(--teal);" title="${rendTxt}">${rendMes>0.004?'+'+brl(rendMes):'—'}</td>
      <td class="money">${brl(stat.saldoCaixinhaTotal)}</td>`;
    }
    rows += `<tr class="${idx===iHoje?'hit':''}">
      <td style="white-space:nowrap;font-weight:600;">${months[idx]}</td>
      <td class="money">${fmt(l.receita)}</td>
      <td class="money">${fmt(l.despesa)}</td>
      <td class="money" style="color:${l.sobra<0?'var(--rust)':'var(--ink)'};">${(l.sobra<0?'−':'')+fmt(Math.abs(l.sobra))}</td>
      <td class="money" style="color:${l.cumulativo<0?'var(--rust)':'var(--ink)'};">${(l.cumulativo<0?'−':'')+fmt(Math.abs(l.cumulativo))}</td>
      ${extras}
    </tr>`;
  });

  box.innerHTML = `
    <div class="year-detalhe-head">
      <div>
        <div class="year-detalhe-title">Detalhe de ${anoAberto}</div>
        <div class="year-detalhe-sub">${a.meses} ${a.meses===1?'mês':'meses'} · acumulado indo de ${brl(saldoIni)} para ${brl(a.cumulativoFim)}</div>
      </div>
      <button class="year-detalhe-close" onclick="toggleAnoDetalhe(${anoAberto})">Fechar ✕</button>
    </div>
    <div class="yd-stats">
      <div class="yd-stat"><div class="lbl">Receita no ano</div><div class="val">${brl(a.receita)}</div></div>
      <div class="yd-stat"><div class="lbl">Despesa no ano</div><div class="val">${brl(a.despesa)}</div></div>
      <div class="yd-stat"><div class="lbl">Sobra no ano</div><div class="val">${brl(a.sobra)}</div></div>
      <div class="yd-stat"><div class="lbl">Acumulado ao fim</div><div class="val">${brl(a.cumulativoFim)}</div></div>
      ${__simComCaixinhas ? `<div class="yd-stat"><div class="lbl">Aportado no ano</div><div class="val">${brl(a.aporteTotal)}</div></div>
      <div class="yd-stat"><div class="lbl">Rendimento no ano</div><div class="val rend">+${brl(a.rendimentoTotal)}</div></div>
      <div class="yd-stat"><div class="lbl">Caixinhas ao fim</div><div class="val">${brl(a.saldoFinalCaixinha)}</div></div>` : ''}
    </div>
    <div class="ledger-scroll${__simComCaixinhas?'':' inv-meses'}">
      <table>
        <thead><tr>
          <th>Mês</th><th class="money">Receita</th><th class="money">Despesa</th>
          <th class="money">Sobra</th><th class="money">Acumulado</th>
          ${__simComCaixinhas ? `<th class="money">Aporte</th><th>Alocação</th><th>Rendimento</th><th class="money">Caixinha total</th>` : ''}
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  box.classList.add('open');
}

    } else {
      seg.itens.forEach((it,idx)=>{
        html += `<div class="custo-row">
          <input class="ci-desc" value="${it.label||''}" oninput="viagemAtualizarCampoItem('${seg.id}',${idx},'label',this.value)">
          <input class="ci-valor" type="number" step="0.01" value="${it.valorEur||0}" oninput="viagemAtualizarCampoItem('${seg.id}',${idx},'valorEur',this.value)">
          <span class="ci-brl" id="custoBRL-${seg.id}-${idx}"></span>
          <button class="ci-del" onclick="viagemRemoverItemCusto('${seg.id}',${idx})">✕</button>
        </div>`;
      });
    }
    html += `<button class="custo-add" onclick="viagemAdicionarItemCusto('${seg.id}')">+ item</button></div>`;
  });
  document.getElementById('custosGrid').innerHTML = html;
  atualizarValoresCustos();

function atualizarValoresCustos(){
  const fx = viagemCustos.fxRateEurBrl || 5.90;
  viagemCustos.segmentos.forEach(seg=>{
    seg.itens.forEach((it,idx)=>{
      const el = document.getElementById(`custoBRL-${seg.id}-${idx}`);
      if(el) el.textContent = 'R$ '+fmtEur((it.valorEur||0)*fx);
    });
    const subEl = document.getElementById(`custoSubtotalEur-${seg.id}`);
    if(subEl) subEl.textContent = '€ '+fmtEur(segTotalEur(seg));
  });
  const totalEur = custosTotalEurGeral();
  document.getElementById('custosTotais').innerHTML =
    `<span class="ttot">€ ${fmtEur(totalEur)}</span><span class="ttot">R$ ${fmtEur(totalEur*fx)}</span>`;
}

function viagemAtualizarCampoItem(segId, idx, field, value){
  const seg = viagemCustos.segmentos.find(s=>s.id===segId);
  const it = seg.itens[idx];
  if(field==='valorEur'){
    it.valorEur = parseFloat(String(value).replace(',','.'))||0;
    atualizarValoresCustos();
  } else {
    it[field] = value;
  }
  salvarViagemCustos();
}
function viagemAdicionarItemCusto(segId){
  const seg = viagemCustos.segmentos.find(s=>s.id===segId);
  seg.itens.push(seg.formatoTabelaDetalhada ? {dia:'',label:'',valorEur:0,site:''} : {label:'',valorEur:0});
  renderViagemCustos();
  salvarViagemCustos();
}
function viagemRemoverItemCusto(segId, idx){
  const seg = viagemCustos.segmentos.find(s=>s.id===segId);
  seg.itens.splice(idx,1);
  renderViagemCustos();
  salvarViagemCustos();
}
function viagemAtualizarFx(value){
  viagemCustos.fxRateEurBrl = parseFloat(String(value).replace(',','.'))||5.90;
  atualizarValoresCustos();
  salvarViagemCustos();
}

/* ---- DESAFIO 40K ---- */
function taxaMensalCDI(){
  const anual = (viagemDesafio.cdiAnualPercent||14.15)/100;
  return Math.pow(1+anual, 1/12) - 1;
}

function recalcularDesafioPessoa(pessoa){
  const r = taxaMensalCDI();
  const N = pessoa.meses.length;
  const pesos = pessoa.meses.map((_,i)=>Math.pow(1+r, N-1-i));
  let somaPonderadaPreenchidos = 0, somaPesosVazios = 0, jaAportado = 0;
  const vaziosIdx = [];
  pessoa.meses.forEach((mes,i)=>{
    const v = pessoa.aportesRealizados[mes];
    if(v!==undefined && v!==null && v!==''){
      somaPonderadaPreenchidos += v*pesos[i];
      jaAportado += v;
    } else {
      somaPesosVazios += pesos[i];
      vaziosIdx.push(i);
    }
  });
  const metaSugerida = somaPesosVazios>0 ? Math.max(0,(pessoa.metaReais - somaPonderadaPreenchidos)/somaPesosVazios) : 0;

  let saldo=0;
  const acumulados = pessoa.meses.map((mes,i)=>{
    const v = pessoa.aportesRealizados[mes];
    const contrib = (v!==undefined && v!==null && v!=='') ? v : metaSugerida;
    saldo = saldo*(1+r) + contrib;
    return saldo;
  });

  pessoa.meses.forEach((mes,i)=>{
    const metaCell = document.getElementById(`metaCell-${pessoa.id}-${i}`);
    const acumCell = document.getElementById(`acumCell-${pessoa.id}-${i}`);
    const v = pessoa.aportesRealizados[mes];
    const preenchido = v!==undefined && v!==null && v!=='';
    if(metaCell) metaCell.textContent = preenchido ? '—' : ('R$ '+fmtEur(metaSugerida));
    if(acumCell) acumCell.textContent = 'R$ '+fmtEur(acumulados[i]);
  });

  const restante = Math.max(0, pessoa.metaReais - jaAportado);
  const rendimentoEstimado = pessoa.metaReais - jaAportado - (metaSugerida*vaziosIdx.length);
  const set = (id,txt)=>{ const el=document.getElementById(id); if(el) el.textContent=txt; };
  set(`resumoJaAportado-${pessoa.id}`, 'R$ '+fmtEur(jaAportado));
  set(`resumoRestante-${pessoa.id}`, 'R$ '+fmtEur(restante));
  set(`resumoSugerido-${pessoa.id}`, 'R$ '+fmtEur(metaSugerida));
  set(`resumoRendimento-${pessoa.id}`, 'R$ '+fmtEur(rendimentoEstimado));

  pessoa.__cache = { jaAportado, metaSugerida, vaziosCount: vaziosIdx.length, rendimentoEstimado };
  recalcularResumoCasal();
}

function recalcularResumoCasal(){
  let jaAportado=0, metaTotal=0, rendimento=0;
  viagemDesafio.pessoas.forEach(p=>{
    metaTotal += p.metaReais;
    if(p.__cache){ jaAportado += p.__cache.jaAportado; rendimento += p.__cache.rendimentoEstimado; }
  });
  const set = (id,txt)=>{ const el=document.getElementById(id); if(el) el.textContent=txt; };
  set('casalJaAportado', 'R$ '+fmtEur(jaAportado));
  set('casalMetaTotal', 'R$ '+fmtEur(metaTotal));
  set('casalRendimento', 'R$ '+fmtEur(rendimento));
}

function viagemAtualizarAporte(personId, mesIdx, value){
  const pessoa = viagemDesafio.pessoas.find(p=>p.id===personId);
  const mes = pessoa.meses[mesIdx];
  const s = String(value).trim();
  if(s===''){ delete pessoa.aportesRealizados[mes]; }
  else { const v = parseFloat(s.replace(',','.')); if(!isNaN(v)) pessoa.aportesRealizados[mes]=v; }
  recalcularDesafioPessoa(pessoa);
  salvarViagemDesafio();
}

function viagemAtualizarCdi(value){
  viagemDesafio.cdiAnualPercent = parseFloat(String(value).replace(',','.'))||14.15;
  viagemDesafio.pessoas.forEach(recalcularDesafioPessoa);
  salvarViagemDesafio();
}

/* =========================================================================
   VIEW: INVESTIMENTOS — a carteira de verdade: cada investimento, para que
   ele serve, e todo aporte, resgate e rendimento. As contas ficam em
   Motor.carteira (motor.js); aqui é só tela e formulário.
   ========================================================================= */
const NOME_MOV = { 'saldo-inicial':'Já estava guardado', aporte:'Aporte', resgate:'Resgate', rendimento:'Rendimento' };
const TIPOS_SUGERIDOS = ['Caixinha / CDB','Tesouro Direto','LCI / LCA','Fundo','Previdência','Ações','FII','Poupança','Cripto','Conta remunerada'];
const invVerTodos = {};
const LIMITE_MOVS = 4;

function hojeIso(){ const h = new Date(); return `${h.getFullYear()}-${String(h.getMonth()+1).padStart(2,'0')}-${String(h.getDate()).padStart(2,'0')}`; }
function dataBr(iso){ return String(iso).split('-').reverse().join('/'); }
function reais2(v){ return Math.round(v*100)/100; }
function comSinal(v){ return (v<0?'−':'+') + 'R$ ' + fmt(Math.abs(v)); }
function fmtPct(v){ return v.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%'; }
function carteiraEditavel(){
  if(!DADOS.carteira || typeof DADOS.carteira!=='object') DADOS.carteira = {};
  if(!Array.isArray(DADOS.carteira.ativos)) DADOS.carteira.ativos = [];
  if(!Array.isArray(DADOS.carteira.movimentos)) DADOS.carteira.movimentos = [];
  return DADOS.carteira;
}
function novoIdMov(){ return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function idDeNome(nome, usados){
  const base = nome.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'investimento';
  let id = base, n = 2;
  while(usados.includes(id)) id = `${base}-${n++}`;
  return id;
}
// Saldo de um investimento num dia, com uma lista de movimentos qualquer (para simular antes de gravar).
function saldoEm(ativoId, data, movimentos){
  const cart = DADOS.carteira || {};
  const c = Motor.carteira({ carteira: { ativos: cart.ativos || [], movimentos: movimentos || cart.movimentos || [] } }, data);
  const a = c.ativos.find(x=>x.id===ativoId);
  return a ? a.saldo : 0;
}
// Devolve o primeiro movimento que deixaria o investimento com saldo negativo, ou null.
function ficariaNegativo(ativoId, movimentos){
  const cart = DADOS.carteira || {};
  const a = Motor.carteira({ carteira: { ativos: cart.ativos || [], movimentos } }).ativos.find(x=>x.id===ativoId);
  return (a && a.movimentos.find(m=>m.saldoApos<0)) || null;
}
function aposMexerNaCarteira(){ renderInvestimentos(); renderConfirmar(); }

function renderInvestimentos(){
  renderMetaAno();
  renderCaixinhas();
  const c = Motor.carteira(DADOS), t = c.totais;
  const resumo = document.getElementById('invResumo'), lista = document.getElementById('invLista'), mesesEl = document.getElementById('invMeses');
  document.getElementById('invNovo').hidden = !c.ativos.length;
  if(!c.ativos.length){
    resumo.innerHTML = '';
    mesesEl.innerHTML = '';
    lista.innerHTML = `<div class="inv-vazio"><strong>Nenhum investimento cadastrado ainda</strong>Crie um para cada lugar onde você guarda dinheiro (uma caixinha, um CDB, o Tesouro), diga para que ele serve e registre cada aporte. Depois é só conferir o saldo de vez em quando para o rendimento aparecer.<br><button class="btn pri" data-inv="novo" style="margin-top:16px;">Criar meu primeiro investimento</button></div>`;
    return;
  }

  const colocado = reais2(t.saldoInicial + t.aportado);
  const datas = c.ativos.flatMap(a=>a.movimentos.map(m=>m.data)).sort();
  const ultima = datas.length ? datas[datas.length-1] : null;
  const abertos = c.ativos.filter(a=>!a.encerrado).length;
  const detalheColocado = (t.saldoInicial>0 && t.aportado>0) ? `<small>${brl(t.saldoInicial)} já guardados + ${brl(t.aportado)} em aportes</small>`
    : (t.saldoInicial>0 ? '<small>dinheiro que já estava guardado</small>' : '');
  resumo.innerHTML = `
    <div class="hero inv">
      <div class="hero-main">
        <div class="hero-label">Total investido</div>
        <div class="hero-val ${t.saldo<0?'neg':''}">${brl(t.saldo)}</div>
        <div class="hero-sub">${abertos} ${abertos===1?'investimento':'investimentos'}${ultima?` · última movimentação em ${dataBr(ultima)}`:' · nenhuma movimentação ainda'}</div>
      </div>
      <div class="conta" aria-label="Como o total é formado">
        <div class="conta-l"><span>Você colocou${detalheColocado}</span><b>${brl(colocado)}</b></div>
        <div class="conta-l"><span>Resgatou</span><b>${t.resgatado>0?'− ':''}${brl(t.resgatado)}</b></div>
        <div class="conta-l"><span>Rendeu${(c.rendimentoPct!=null && t.rendimento!==0)?`<small>${fmtPct(c.rendimentoPct)} sobre o que você colocou</small>`:''}</span><b class="${t.rendimento>0?'pos':(t.rendimento<0?'neg':'')}">${t.rendimento!==0?comSinal(t.rendimento):brl(0)}</b></div>
        <div class="conta-l total"><span>Total investido</span><b>${brl(t.saldo)}</b></div>
      </div>
    </div>`;

  const ordenados = c.ativos.filter(a=>!a.encerrado).concat(c.ativos.filter(a=>a.encerrado));
  lista.innerHTML = ordenados.map(cardInvestimento).join('');

  const meses = c.porMes.slice().reverse();
  const ouTraco = (v, txt) => Math.abs(v)>0.004 ? txt : '—';
  mesesEl.innerHTML = meses.length ? `
    <div class="section-title" style="margin-top:22px;"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/></svg>Mês a mês</div>
    <div class="ledger-scroll inv-meses"><table>
      <thead><tr><th>Mês</th><th class="money">Colocou</th><th class="money">Resgatou</th><th class="money">Rendeu</th><th class="money">Total (R$)</th></tr></thead>
      <tbody>${meses.map(l=>{
        const col = reais2(l.saldoInicial + l.aportado);
        return `<tr><td>${l.mes}</td><td class="money">${ouTraco(col, fmt(col))}</td><td class="money">${ouTraco(l.resgatado, fmt(l.resgatado))}</td><td class="money" style="${l.rendimento<0?'color:var(--rust)':(l.rendimento>0?'color:var(--teal)':'')}">${ouTraco(l.rendimento, (l.rendimento<0?'−':'+')+fmt(Math.abs(l.rendimento)))}</td><td class="money">${fmt(l.saldoFinal)}</td></tr>`;
      }).join('')}</tbody>
    </table></div>` : '';
}

/* Meta do ano: soma do Investimento e da Reserva previstos nos meses do ano (divisão da sobra),
   contra o que já foi marcado como pago em Meu Mês. A marca na barra é o esperado até o mês de hoje. */
let metaAnoSel = null;
function renderMetaAno(){
  const el = document.getElementById('invMeta');
  const div = M.divisao;
  if(!div){ el.innerHTML = ''; return; }
  const hoje = new Date(), hojeAbs = hoje.getFullYear()*12 + hoje.getMonth();
  const anos = [...new Set(months.map(m=>2000+parseInt(m.slice(4),10)))];
  if(metaAnoSel==null){
    const comMeta = anos.filter(a=>M.metasDoAno(a, hojeAbs).investimento.meta>0);
    metaAnoSel = comMeta.includes(hoje.getFullYear()) ? hoje.getFullYear() : (comMeta[0] || hoje.getFullYear());
  }
  const mt = M.metasDoAno(metaAnoSel, hojeAbs);
  const linha = (cls, titulo, o) => {
    const pct = pctDe(o.feito, o.meta), marca = o.meta>0 ? Math.min(100, o.esperadoAte/o.meta*100) : 0;
    const dif = Math.round((o.feito - o.esperadoAte)*100)/100;
    const status = o.meta<=0 ? 'nada previsto neste ano'
      : (o.esperadoAte<=0 ? `começa em ${esc(div.desde)}`
      : (dif>=-0.004 ? `<span class="ok">em dia${dif>0.004?` (+${brl(dif)})`:''}</span>` : `<span class="atras">faltam ${brl(-dif)} do esperado</span>`));
    return `<div class="meta-linha ${cls}">
      <div class="meta-l1"><span>${titulo}</span><span><b>${brl(o.feito)}</b> de ${brl(o.meta)}</span></div>
      <div class="meta-bar"><i style="width:${pct.toFixed(1)}%${pct>0?';min-width:8px':''}"></i>${o.esperadoAte>0 && marca<100 ? `<span class="marca" style="left:${marca.toFixed(1)}%" title="esperado até hoje"></span>` : ''}</div>
      <div class="meta-l2"><span>esperado até hoje <b>${brl(o.esperadoAte)}</b></span><span>${status}</span></div>
    </div>`;
  };
  const idxAno = anos.indexOf(metaAnoSel);
  el.innerHTML = `<div class="meta-card">
    <div class="meta-topo"><div class="meta-titulo">Meta de ${metaAnoSel}</div>
      <div class="meta-ano"><button class="btn mini fantasma" data-meta="ant" ${idxAno<=0?'disabled':''} aria-label="Ano anterior">‹</button><b>${metaAnoSel}</b><button class="btn mini fantasma" data-meta="prox" ${idxAno>=anos.length-1?'disabled':''} aria-label="Próximo ano">›</button></div></div>
    <div class="meta-lede">A partir de ${esc(div.desde)}, a sobra de cada mês vai ${div.investimento}% para investimento, ${div.reserva}% para a reserva de emergência e ${div.avulsos.toLocaleString('pt-BR')}% para o auxílio pessoal${div.tetoAvulsos!=null ? ` (no máximo ${brl(div.tetoAvulsos)}; o que passar vai para investimento e reserva)` : ''}${div.restoParaInvestimento ? ` — e o que não for gasto do auxílio vai para ${destResto()}` : ''}.${textoMudancaReserva()} Conta como feito quando você marca o item em Meu Mês.</div>
    ${linha('inv', `Investimento (${pctsDivisao('investimento')})`, mt.investimento)}
    ${linha('res', `Reserva de emergência (${pctsDivisao('reserva')})`, mt.reserva)}
    ${mt.restoParaInvestimento ? linha(mt.restoDestino==='reserva' ? 'res' : 'inv', `Sobra do auxílio (vai para ${destResto()})`, mt.restoAvulsos) : ''}
  </div>`;
}
document.getElementById('invMeta').addEventListener('click', (ev)=>{
  const b = ev.target.closest('[data-meta]'); if(!b) return;
  const anos = [...new Set(months.map(m=>2000+parseInt(m.slice(4),10)))];
  const i = anos.indexOf(metaAnoSel) + (b.dataset.meta==='ant'?-1:1);
  if(i>=0 && i<anos.length){ metaAnoSel = anos[i]; renderMetaAno(); renderCaixinhas(); }
});

/* =========================================================================
   CAIXINHAS — o dinheiro do investimento e da reserva rendendo como no banco (ex.: Caixinha Nubank
   a 100% do CDI). Usa o CDI de cada dia que já passou (gravado todo dia útil pelo workflow
   "Atualizar CDI") e, para os dias que faltam, o cenário escolhido. Mostra o que você recebe se tirar
   tudo no fim do ano, quanto fica de IR/IOF e como muda se o CDI cair ou subir.
   ========================================================================= */
let cxModo = 'previsto', cxDelta = 0, cxCdiManual = null;
const cxRetirada = { investimento: null, reserva: null };
function dataBrCurta(iso){ return iso ? iso.split('-').reverse().join('/') : ''; }
function cdiCenario(base){ return cxCdiManual!=null ? cxCdiManual : Math.max(0, reais2(base + cxDelta)); }
function renderCaixinhas(){
  const el = document.getElementById('invCaixinhas');
  if(!M.divisao || !M.caixinhasDivisao){ el.innerHTML = ''; return; }
  const ano = metaAnoSel || new Date().getFullYear();
  const base = M.caixinhasDivisao(ano, { modo: cxModo });
  if(!base){ el.innerHTML = ''; return; }
  const cdiHoje = base.cdiHoje, cdiUsado = cdiCenario(cdiHoje);
  const atual = M.caixinhasDivisao(ano, { modo: cxModo, cdiAnual: cdiUsado });
  const cenarios = [-2, 0, 2].map(d=>({ d, cdi: Math.max(0, reais2(cdiHoje + d)) }));
  if(cxCdiManual!=null && !cenarios.some(c=>Math.abs(c.cdi-cxCdiManual)<0.001)) cenarios.push({ d: null, cdi: cxCdiManual });
  const porCenario = cenarios.map(c=>({ ...c, r: M.caixinhasDivisao(ano, { modo: cxModo, cdiAnual: c.cdi }) }));
  const pctTxt2 = v => (Math.round(v*100)/100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
  const segCdi = [[-2,'Cai 2 p.p.'],[0,'Igual a hoje'],[2,'Sobe 2 p.p.']].map(([d,n])=>`<button type="button" data-cx="delta" data-v="${d}" aria-pressed="${cxCdiManual==null && cxDelta===d}">${n}<small>${pctTxt2(Math.max(0,cdiHoje+d))}</small></button>`).join('');
  const atualizado = base.atualizadoEm ? `atualizado em ${dataBrCurta(base.atualizadoEm)}` : '';
  // Ano a ano: quanto cada caixinha teria se tirasse tudo em 31/12 de cada ano (mesmo cenário de CDI)
  const anosCx = [...new Set(months.map(m=>2000+parseInt(m.slice(4),10)))].filter(a=>a>=2000+parseInt(M.divisao.desde.slice(4),10));
  const ultimoMes = months[months.length-1];
  const linhasAno = anosCx.map(a=>{ const r = (a===ano) ? atual : M.caixinhasDivisao(a, { modo: cxModo, cdiAnual: cdiUsado });
    return { ano: a, res: r.reserva.liquido, inv: r.investimento.liquido, tot: reais2(r.reserva.liquido + r.investimento.liquido), ap: reais2(r.reserva.aportado + r.investimento.aportado), parcial: ultimoMes.endsWith('/'+String(a).slice(2)) && !ultimoMes.startsWith('Dez') }; });
  const maxTot = Math.max(1, ...linhasAno.map(l=>l.tot));
  const curto = v => v>=1e6 ? (v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi' : (v>=1e3 ? Math.round(v/1e3).toLocaleString('pt-BR')+' mil' : fmt(v));
  const anoAnoHtml = linhasAno.length<2 ? '' : `<div class="cx-anos">
      <div class="tit">Ano a ano</div>
      <div class="sub">Quanto você recebe se tirar tudo em 31/12 de cada ano, já sem o IR, com o CDI de ${pctTxt2(cdiUsado)} daqui pra frente e ${cxModo==='realizado'?'só o que já foi transferido':'tudo o que está previsto'}. Toque num ano para ver o detalhe nos cards acima.</div>
      <div class="leg"><span><i style="background:#d28e05"></i>Reserva</span><span><i style="background:#00a888"></i>Investimento</span></div>
      <div class="cx-anos-barras">${linhasAno.map(l=>`<button type="button" class="cx-ano-col ${l.ano===ano?'sel':''}" data-cx="ir-ano" data-v="${l.ano}" title="${l.ano}: reserva ${brl(l.res)} + investimento ${brl(l.inv)} = ${brl(l.tot)}" style="--h:${(l.tot/maxTot*100).toFixed(1)}%">
          <span class="v" style="bottom:calc(${(l.tot/maxTot*100).toFixed(1)}% + 4px)">${curto(l.tot)}</span>
          <i class="inv" style="height:${(l.inv/maxTot*100).toFixed(2)}%"></i><i class="res" style="height:${(l.res/maxTot*100).toFixed(2)}%"></i></button>`).join('')}</div>
      <div class="cx-anos-rot">${linhasAno.map(l=>`<span class="${l.ano===ano?'sel':''}">${String(l.ano).slice(2)}</span>`).join('')}</div>
      <table><thead><tr><th>Ano</th><th>Reserva</th><th>Investimento</th><th>Total</th><th class="col-ap">Você colocou</th></tr></thead>
        <tbody>${linhasAno.map(l=>`<tr class="${l.ano===ano?'sel':''}" data-cx="ir-ano" data-v="${l.ano}"><td>${l.ano}${l.parcial?'*':''}</td><td class="r">${fmt(l.res)}</td><td class="i">${fmt(l.inv)}</td><td class="t">${fmt(l.tot)}</td><td class="col-ap">${fmt(l.ap)}</td></tr>`).join('')}</tbody></table>
      ${linhasAno.some(l=>l.parcial)?`<div class="sub" style="margin:8px 0 0;">* o app projeta até ${ultimoMes}; depois disso nada novo entra, só rende.</div>`:''}
    </div>`;
  const card = (tipo, nome, sub, ico) => {
    const r = atual[tipo];
    if(!r.aportado){ return `<div class="cx-card ${tipo==='investimento'?'inv':'res'}"><div class="cx-head">${ico}<div><b>${nome}</b><small>${sub}</small></div></div><div class="empty-hint">${cxModo==='realizado' ? 'Nada transferido ainda. Marque o item em Meu Mês quando transferir.' : 'Nada previsto até o fim de '+ano+'.'}</div></div>`; }
    const doAno = r.porMes.filter(x=>x.ate.startsWith(String(ano)));
    const maxV = Math.max(1, ...doAno.map(x=>x.saldoBruto));
    const barras = doAno.map(x=>{ const ap = Math.min(x.aportado, x.saldoBruto), re = Math.max(0, x.saldoBruto - ap);
      return `<div class="cx-barra" title="${x.mes}: saldo ${brl(x.saldoBruto)} (colocado ${brl(x.aportado)} + rendeu ${brl(x.rendimento)})"><i class="ap" style="height:${(ap/maxV*100).toFixed(1)}%"></i>${re>0.5?`<i class="re" style="height:${Math.max(2,re/maxV*100).toFixed(1)}%"></i>`:''}</div>`; }).join('');
    const meses = doAno.map(x=>`<span>${x.mes.slice(0,3)}</span>`).join('');
    const linhasCen = porCenario.map(c=>{ const v = c.r[tipo].liquido, dif = reais2(v - porCenario.find(z=>z.d===0).r[tipo].liquido);
      const sel = Math.abs(c.cdi - cdiUsado) < 0.001;
      return `<tr class="${sel?'sel':''}"><td>${c.d===0?'CDI igual a hoje':(c.d==null?'CDI que você digitou':(c.d<0?'CDI cai 2 p.p.':'CDI sobe 2 p.p.'))}</td><td class="n">${pctTxt2(c.cdi)}</td><td class="n">${brl(v)}</td><td class="n ${dif>0?'pos':(dif<0?'neg':'')}">${Math.abs(dif)<0.005?'—':(dif>0?'+':'−')+brl(Math.abs(dif)).replace('R$ ','')}</td></tr>`; }).join('');
    const ret = cxRetirada[tipo];
    let retHtml = '';
    if(ret && ret.res){
      const x = ret.res;
      retHtml = x.faltou>0.004 ? `<div class="cx-ret-res">Em ${dataBrCurta(ret.data)} a caixinha só teria <b>${brl(x.bruto)}</b>. Faltam ${brl(x.faltou)}.</div>`
        : `<div class="cx-ret-res">Tirando <b>${brl(x.bruto)}</b> em ${dataBrCurta(ret.data)}: rendimento dessa parte ${brl(x.rendimento)}, IOF <b>${brl(x.iof)}</b>, IR <b>${brl(x.ir)}</b>. Você recebe <b>${brl(x.liquido)}</b>.</div>`;
    }
    return `<div class="cx-card ${tipo==='investimento'?'inv':'res'}" data-tipo="${tipo}">
      <div class="cx-head">${ico}<div><b>${nome}</b><small>${sub}</small></div></div>
      <div class="cx-big"><span>Se tirar tudo em 31/12/${ano}, você recebe</span><b>${brl(r.liquido)}</b></div>
      <div class="cx-stats">
        <div><span>Você coloca</span><b>${brl(r.aportado)}</b></div>
        <div><span>Rende (bruto)</span><b class="pos">+${brl(r.rendimento).replace('R$ ','R$ ')}</b></div>
        <div><span>Saldo no banco</span><b>${brl(r.saldoBruto)}</b></div>
        <div><span>IR${r.iof>0.004?' + IOF':''} ao tirar tudo</span><b class="neg">−${brl(reais2(r.ir + r.iof))}</b></div>
      </div>
      <div class="cx-graf"><div class="tit"><span>Saldo no fim de cada mês de ${ano}</span><span class="leg"><span><i style="background:${tipo==='investimento'?'#00a888':'#d28e05'}"></i>colocado</span><span><i style="background:${tipo==='investimento'?'#7fe0d3':'#f2cd7d'}"></i>rendimento</span></span></div>
        <div class="cx-barras">${barras}</div><div class="cx-meses">${meses}</div></div>
      <table class="cx-cen"><thead><tr><th>Se o CDI daqui pra frente…</th><th class="n">CDI</th><th class="n">Você recebe</th><th class="n">vs. hoje</th></tr></thead><tbody>${linhasCen}</tbody></table>
      <div class="cx-ret"><div class="tit">Simular uma retirada</div>
        <div class="cx-ret-form"><input type="text" inputmode="decimal" placeholder="R$ 0,00" data-cx-valor value="${ret?fmt(ret.valor):''}" aria-label="Valor a tirar"><input type="date" data-cx-data value="${ret?ret.data:`${ano}-12-31`}" aria-label="Data da retirada"><button type="button" class="btn mini" data-cx="retirar">Calcular</button></div>
        ${retHtml}</div>
    </div>`;
  };
  el.innerHTML = `
    <div class="inv-topo cx-topo-ano"><div class="section-title"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a4 4 0 018 0v2"/><path d="M12 12v3"/></svg>${esc(base.nome)} · ${base.percentualCdi}% do CDI</div>
      <div class="cx-ano-nav" role="group" aria-label="Ano"><button type="button" data-cx="ano" data-v="-1" ${anosCx.indexOf(ano)<=0?'disabled':''} aria-label="Ano anterior">‹</button><b>${ano}</b><button type="button" data-cx="ano" data-v="1" ${anosCx.indexOf(ano)>=anosCx.length-1?'disabled':''} aria-label="Próximo ano">›</button></div></div>
    <div class="cx-juros"><span>CDI hoje <b>${pctTxt2(cdiHoje)} a.a.</b></span>${base.selicMeta!=null?`<span>Selic <b>${pctTxt2(base.selicMeta)}</b></span>`:''}<span>${atualizado}</span><span class="cx-auto">atualiza sozinho todo dia útil</span></div>
    <div class="cx-controles">
      <div class="cx-seg" role="group" aria-label="O que somar"><button type="button" data-cx="modo" data-v="previsto" aria-pressed="${cxModo==='previsto'}">Tudo o que está previsto</button><button type="button" data-cx="modo" data-v="realizado" aria-pressed="${cxModo==='realizado'}">Só o que já transferi</button></div>
      <span class="cx-rot">CDI daqui pra frente</span>
      <div class="cx-seg" role="group" aria-label="Cenário do CDI">${segCdi}</div>
      <input class="cx-cdi-in" type="number" step="0.25" min="0" max="40" placeholder="outro %" data-cx="cdi" value="${cxCdiManual!=null?cxCdiManual:''}" aria-label="Outro CDI em % ao ano">
    </div>

/* =========================================================================
   VIEW: ASSINATURAS — o que pesa no cartão todo mês e quem já pagou a parte dele.
   Nada daqui entra nas contas do mês: é só controle do cartão e da divisão.

let assAno = new Date().getFullYear();
function assinaturasEditaveis(){
  if(!DADOS.assinaturas || typeof DADOS.assinaturas!=='object') DADOS.assinaturas = {};
  if(!Array.isArray(DADOS.assinaturas.itens)) DADOS.assinaturas.itens = [];
  return DADOS.assinaturas;
}
function mesDeHojeLabel(){ const h = new Date(); return Motor.mesLabel(h.getFullYear()*12 + h.getMonth()); }

  const cartaoEl = document.getElementById('assCartao'), lista = document.getElementById('assLista'), divEl = document.getElementById('assDivisao');
  const nomeCartao = s.cartao.nome || 'cartão';

  cartaoEl.innerHTML = `
    <div class="hero">
      <div class="hero-main">
        <div class="hero-label">Assinaturas por mês</div>
        <div class="hero-val ${temLimite && s.livre<0?'neg':''}">${brl(s.total)}</div>
        <div class="hero-sub">${n} ${n===1?'assinatura':'assinaturas'} no ${esc(nomeCartao)}${temLimite?` · limite <b>${brl(s.cartao.limite)}</b>`:''}</div>
      </div>
      ${temLimite ? `<div class="hero-meters">
        <div class="meter ${s.livre<0?'pag':'rec'}">
          <div class="meter-top"><span>Usado do limite</span><b>${pct.toFixed(0)}%</b></div>
          <div class="meter-bar">${barraHtml(pct)}</div>
          <div class="meter-falta">${s.livre>=0 ? `sobram ${brl(s.livre)} do limite para o resto` : `estoura o limite em ${brl(-s.livre)}`}</div>
        </div>
      </div>` : ''}
      <button type="button" class="hero-invest" data-ass="cartao"><div class="hero-label">Cartão</div><div class="hi-val">${esc(nomeCartao)}</div><div class="hi-sub">${temLimite?'Editar limite':'Definir limite'} ›</div></button>
    </div>`;

  lista.innerHTML = n ? `<div class="ass-card">${s.itens.map(it=>{
      let sub = '';
      if(it.divisao && it.divisao.pessoas.length){
        const p0 = it.divisao.pessoas[0];
        sub = `dividido entre ${it.divisao.pessoas.length} pessoas · ${brl(p0.valorAno)} por pessoa no ano`;
      } else if(it.dia) sub = `cobrado dia ${it.dia}`;

      return `<button type="button" class="ass-linha" data-ass="editar" data-id="${esc(it.id)}" title="Toque para editar">

        <span class="v">${brl(it.valor)}</span>
      </button>`;
    }).join('')}
    <div class="ass-linha total"><span class="n">Total por mês no ${esc(nomeCartao)}</span><span class="v">${brl(s.total)}</span></div>
  </div>` : `<div class="inv-vazio"><strong>Nenhuma assinatura cadastrada</strong>Cadastre o que é cobrado todo mês no cartão para ver quanto do limite elas ocupam.<br><button class="btn pri" data-ass="nova" style="margin-top:16px;">Cadastrar assinatura</button></div>`;

  const hoje = mesDeHojeLabel();
  divEl.innerHTML = s.itens.filter(it=>it.divisao && it.divisao.pessoas.length).map(it=>{
    const d = it.divisao, p0 = d.pessoas[0];
    const grade = d.porMes.map(m=>{
      const vazio = !m.pessoas.length;
      const nomes = m.pessoas.map(x=>x.nome).join(' + ');
      const status = vazio ? 'ninguém' : (m.pago ? (m.pessoas.every(x=>x.anoTodo) ? 'pago (ano todo)' : 'pago') : 'falta pagar');
      return `<button type="button" class="ass-mes ${m.pago?'pago':''} ${vazio?'vazio':''} ${m.mes===hoje?'atual':''}" data-ass="mes" data-id="${esc(it.id)}" data-mes="${m.nome}" ${vazio?'disabled':''} title="${vazio?'':'Toque para marcar/desmarcar'}">
        <span class="m"><span>${m.nome}</span>${m.pago?'<span>✓</span>':''}</span>
        <span class="p">${vazio?'—':esc(nomes)}</span>
