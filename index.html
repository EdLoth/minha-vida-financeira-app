/* =========================================================================
   VIEW: ASSINATURAS — o que pesa no cartão todo mês e quem já pagou a parte dele.
   Nada daqui entra nas contas do mês: é só controle do cartão e da divisão.
   ========================================================================= */
let assAno = new Date().getFullYear();
function assinaturasEditaveis(){
  if(!DADOS.assinaturas || typeof DADOS.assinaturas!=='object') DADOS.assinaturas = {};
  if(!Array.isArray(DADOS.assinaturas.itens)) DADOS.assinaturas.itens = [];
  return DADOS.assinaturas;
}
function mesDeHojeLabel(){ const h = new Date(); return Motor.mesLabel(h.getFullYear()*12 + h.getMonth()); }

function renderAssinaturas(){
  const s = Motor.assinaturas(DADOS, assAno);
  const cartaoEl = document.getElementById('assCartao'), lista = document.getElementById('assLista'), divEl = document.getElementById('assDivisao');
  const nomeCartao = s.cartao.nome || 'cartão';
  const n = s.itens.length;
  const temLimite = s.cartao.limite!=null;
  const pct = temLimite ? pctDe(s.total, s.cartao.limite) : 0;
  cartaoEl.innerHTML = `
    <div class="hero">
      <div class="hero-main">
        <div class="hero-label">Assinaturas por mês</div>
        <div class="hero-val ${temLimite && s.livre<0?'neg':''}">${brl(s.total)}</div>
        <div class="hero-sub">${n} ${n===1?'assinatura':'assinaturas'} no ${esc(nomeCartao)}${temLimite?` · limite <b>${brl(s.cartao.limite)}</b>`:''}</div>
      </div>
      ${temLimite ? `<div class="hero-meters">
        <div class="meter ${s.livre<0?'pag':'rec'}">
          <div class="meter-top"><span>Usado do limite</span><b>${pct.toFixed(0)}%</b></div>
          <div class="meter-bar">${barraHtml(pct)}</div>
          <div class="meter-falta">${s.livre>=0 ? `sobram ${brl(s.livre)} do limite para o resto` : `estoura o limite em ${brl(-s.livre)}`}</div>
        </div>
      </div>` : ''}
      <button type="button" class="hero-invest" data-ass="cartao"><div class="hero-label">Cartão</div><div class="hi-val">${esc(nomeCartao)}</div><div class="hi-sub">${temLimite?'Editar limite':'Definir limite'} ›</div></button>
    </div>`;

  lista.innerHTML = n ? `<div class="ass-card">${s.itens.map(it=>{
      let sub = '';
      if(it.divisao && it.divisao.pessoas.length){
        const p0 = it.divisao.pessoas[0];
        sub = `dividido entre ${it.divisao.pessoas.length} pessoas · ${brl(p0.valorAno)} por pessoa no ano`;
      } else if(it.dia) sub = `cobrado dia ${it.dia}`;
      if(it.obs && !it.divisao) sub = (sub ? sub + ' · ' : '') + esc(it.obs);
      return `<button type="button" class="ass-linha" data-ass="editar" data-id="${esc(it.id)}" title="Toque para editar">
        <span class="n">${esc(it.nome)}${sub?`<span class="sub">${sub}</span>`:''}</span>
        <span class="v">${brl(it.valor)}</span>
      </button>`;
    }).join('')}
    <div class="ass-linha total"><span class="n">Total por mês no ${esc(nomeCartao)}</span><span class="v">${brl(s.total)}</span></div>
  </div>` : `<div class="inv-vazio"><strong>Nenhuma assinatura cadastrada</strong>Cadastre o que é cobrado todo mês no cartão para ver quanto do limite elas ocupam.<br><button class="btn pri" data-ass="nova" style="margin-top:16px;">Cadastrar assinatura</button></div>`;

  const hoje = mesDeHojeLabel();
  divEl.innerHTML = s.itens.filter(it=>it.divisao && it.divisao.pessoas.length).map(it=>{
    const d = it.divisao, p0 = d.pessoas[0];
    const grade = d.porMes.map(m=>{
      const vazio = !m.pessoas.length;
      const nomes = m.pessoas.map(x=>x.nome).join(' + ');
      const status = vazio ? 'ninguém' : (m.pago ? (m.pessoas.every(x=>x.anoTodo) ? 'pago (ano todo)' : 'pago') : 'falta pagar');
      return `<button type="button" class="ass-mes ${m.pago?'pago':''} ${vazio?'vazio':''} ${m.mes===hoje?'atual':''}" data-ass="mes" data-id="${esc(it.id)}" data-mes="${m.nome}" ${vazio?'disabled':''} title="${vazio?'':'Toque para marcar/desmarcar'}">
        <span class="m"><span>${m.nome}</span>${m.pago?'<span>✓</span>':''}</span>
        <span class="p">${vazio?'—':esc(nomes)}</span>
        <span class="s">${status}</span>
      </button>`;
    }).join('');

      <div class="ass-pessoa ${p.quitado?'ok':''}">
        <div class="pn">${esc(p.nome)}${p.quitado?' ✓':''}<small>${p.meses.map(m=>`${m.nome}${m.pago?' ✓':''}`).join(' · ')||'sem mês'}${p.obs?' · '+esc(p.obs):''}</small></div>
        <div class="pv">${brl(p.valorPago)} / ${brl(p.valorAno)}</div>
        <button type="button" class="btn mini ${p.anoTodo?'pri':''}" data-ass="ano" data-id="${esc(it.id)}" data-pessoa="${esc(p.id)}" title="Pagou os ${brl(p.valorAno)} de uma vez">${p.anoTodo?'Ano todo ✓':'Ano todo'}</button>
      </div>`).join('');
    return `<div class="section-title" style="margin-top:22px;"><svg class="icon" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>Quem paga o ${esc(it.nome)}</div>
    <div class="ass-card">
      <div class="ass-ano"><button type="button" class="btn mini fantasma" data-ass="ano-ant" aria-label="Ano anterior">‹</button><b>${d.ano}</b><button type="button" class="btn mini fantasma" data-ass="ano-prox" aria-label="Próximo ano">›</button></div>
      <div class="ass-resumo">${d.mesesPagos} de ${d.mesesCobertos} meses pagos em ${d.ano} · ${brl(it.valor)} por mês · ${brl(p0.valorAno)} por pessoa no ano</div>
      <div class="ass-meses">${grade}</div>
      <div class="ass-pessoas">${pessoas}</div>
      <p class="ass-dica">Toque num mês para marcar que a pessoa daquele mês já pagou. "Ano todo" é para quem pagou os ${brl(p0.valorAno)} de uma vez e cobre os dois meses.</p>
    </div>`;
  }).join('');
}

function alternarPagoAssinatura(itemId, mesNome, pessoaId){
  const ass = assinaturasEditaveis();
  const it = ass.itens.find(x=>x.id===itemId);
  if(!it || !it.divisao || !Array.isArray(it.divisao.pessoas)) return;
  if(!it.divisao.pagos || typeof it.divisao.pagos!=='object') it.divisao.pagos = {};
  const pagos = it.divisao.pagos, aa = String(assAno%100).padStart(2,'0');
  if(mesNome){
    const resp = it.divisao.pessoas.filter(p=>Array.isArray(p.meses) && p.meses.includes(mesNome));
    if(!resp.length) return;
    const anoTodo = resp.filter(p=>pagos[`${p.id}|ano/${aa}`]===true);
    if(anoTodo.length){
      const quem = anoTodo.map(p=>p.nome).join(' e ');
      if(!confirm(`${quem} está marcado como "ano todo" em ${assAno}, então ${mesNome} já conta como pago.\n\nDesmarcar o ano todo?`)) return;
      anoTodo.forEach(p=>{ pagos[`${p.id}|ano/${aa}`] = false; });
      gravar(`desmarca ${quem} como pago o ano todo no ${it.nome} (${assAno})`);
    } else {
      const chaves = resp.map(p=>`${p.id}|${mesNome}/${aa}`);
      const jaPago = chaves.every(k=>pagos[k]===true);
      chaves.forEach(k=>{ pagos[k] = !jaPago; });
      gravar(`${jaPago?'desmarca':'marca'} ${resp.map(p=>p.nome).join(' e ')} como pago no ${it.nome} (${mesNome}/${aa})`);
    }
  } else {
    const p = it.divisao.pessoas.find(x=>x.id===pessoaId);
    if(!p) return;
    const k = `${p.id}|ano/${aa}`, novo = pagos[k]!==true;
    pagos[k] = novo;
    gravar(`${novo?'marca':'desmarca'} ${p.nome} como pago o ano todo no ${it.nome} (${assAno})`);
  }
  renderAssinaturas();
}

document.getElementById('view-assinaturas').addEventListener('click', (ev)=>{
  const el = ev.target.closest('[data-ass]');
  if(!el) return;
  const acao = el.dataset.ass, id = el.dataset.id;
  if(acao==='nova') formAssinatura(null);
  else if(acao==='editar') formAssinatura(id);
  else if(acao==='cartao') formCartaoAssinaturas();
  else if(acao==='ano-ant'){ assAno--; renderAssinaturas(); }
  else if(acao==='ano-prox'){ assAno++; renderAssinaturas(); }
  else if(acao==='mes') alternarPagoAssinatura(id, el.dataset.mes, null);
  else if(acao==='ano') alternarPagoAssinatura(id, null, el.dataset.pessoa);
});

function formAssinatura(id){
  const ass = assinaturasEditaveis();
  const it = id ? ass.itens.find(x=>x.id===id) : null;
  if(id && !it) return;
  const val = (k)=>esc(it && it[k]!=null ? it[k] : '');
  abrirSheet({
    titulo: it ? 'Editar assinatura' : 'Nova assinatura',
    rotuloOk: it ? 'Salvar' : 'Cadastrar',
    corpo: `
      <label class="campo"><span>Nome</span><input id="fs-nome" maxlength="60" placeholder="Ex.: Netflix" value="${val('nome')}" data-foco></label>
      <div class="campo-linha">
        <label class="campo"><span>Valor por mês</span><input id="fs-valor" class="num" inputmode="decimal" placeholder="R$ 0,00" value="${it?fmt(it.valor):''}"></label>
        <label class="campo"><span>Dia da cobrança <em>(opcional)</em></span><input id="fs-dia" inputmode="numeric" maxlength="2" placeholder="Ex.: 10" value="${val('dia')}"></label>
      </div>
      <label class="campo"><span>Observações <em>(opcional)</em></span><textarea id="fs-obs" maxlength="300" style="min-height:52px;">${val('obs')}</textarea></label>
      ${it && it.divisao ? '<p class="sheet-dica">Quem paga quais meses (a divisão) é alterado pelo chat.</p>' : ''}`,
    salvar: ()=>{
      const v = (k)=>document.getElementById(k).value.trim();
      const nome = v('fs-nome');
      if(!nome) return 'Dê um nome à assinatura.';
      const valor = parseValor(v('fs-valor'));
      if(isNaN(valor) || valor<0) return 'O valor por mês precisa ser um número em reais.';
      let dia = null;
      if(v('fs-dia')){ dia = parseInt(v('fs-dia'),10); if(!(dia>=1 && dia<=31)) return 'O dia da cobrança precisa ser de 1 a 31.'; }
      const alvo = it || { id: idDeNome(nome, ass.itens.map(x=>x.id)) };
      alvo.nome = nome; alvo.valor = reais2(valor);
      if(dia) alvo.dia = dia; else delete alvo.dia;
      const obs = v('fs-obs'); if(obs) alvo.obs = obs; else delete alvo.obs;
      if(!it) ass.itens.push(alvo);
      gravar(`${it?'altera':'cadastra'} assinatura ${nome} (${brl(alvo.valor)}/mês)`);
      renderAssinaturas();
      return null;
    },
    excluir: it ? ()=>{
      if(!confirm(`Excluir a assinatura "${it.nome}"?${it.divisao?'\n\nIsso apaga também as marcações de quem já pagou.':''}`)) return false;
      ass.itens = ass.itens.filter(x=>x.id!==id);
      gravar(`remove assinatura ${it.nome}`);
      renderAssinaturas();
      return null;
    } : null,
  });
}

function formCartaoAssinaturas(){
  const ass = assinaturasEditaveis();
  if(!ass.cartao || typeof ass.cartao!=='object') ass.cartao = {};
  const c = ass.cartao;
  abrirSheet({
    titulo: 'Cartão das assinaturas',
    corpo: `
      <label class="campo"><span>Cartão</span><input id="fc-nome" maxlength="40" placeholder="Ex.: Nu Crédito" value="${esc(c.nome||'')}" data-foco></label>
      <label class="campo"><span>Limite <em>(opcional)</em></span><input id="fc-limite" class="num" inputmode="decimal" placeholder="R$ 0,00" value="${c.limite!=null?fmt(c.limite):''}"></label>
      <p class="sheet-dica">O limite serve só para mostrar quanto do cartão as assinaturas ocupam. Não entra em nenhuma conta do mês.</p>`,

      const nome = document.getElementById('fc-nome').value.trim();
      const lim = document.getElementById('fc-limite').value.trim();
      const limite = lim ? parseValor(lim) : null;

      gravar(`altera cartão das assinaturas (${nome||'sem nome'}, limite ${limite!=null?brl(limite):'não definido'})`);
      renderAssinaturas();
      return null;
    },
  });
}

          : `<label class="campo"><span>Já tem dinheiro guardado nele? <em>Saldo de hoje (opcional)</em></span><input id="fa-saldo" class="num" inputmode="decimal" placeholder="R$ 0,00"></label>
             <p class="sheet-dica">Esse valor entra como "já estava guardado": aparece no investimento, mas não é descontado do seu saldo do mês.</p>`}
      <datalist id="fa-tipos">${TIPOS_SUGERIDOS.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>`,

      }
      const cart = carteiraEditavel();
      const alvo = id ? cart.ativos.find(x=>x.id===id) : { id: idDeNome(nome, cart.ativos.map(x=>x.id)) };
      if(!alvo) return 'Este investimento não existe mais (foi removido em outro lugar).';
      alvo.nome = nome;
      [['objetivo','fa-objetivo'],['instituicao','fa-inst'],['tipo','fa-tipo'],['rentabilidade','fa-rent'],['obs','fa-obs']].forEach(([campo, el])=>{
        const txt = v(el);
        if(txt) alvo[campo] = txt; else delete alvo[campo];
      });
      if(id){
        if(document.getElementById('fa-enc').checked) alvo.encerrado = true; else delete alvo.encerrado;
        gravar(`altera investimento ${nome}`);
      } else {
        cart.ativos.push(alvo);
        if(saldo>0) cart.movimentos.push({ id: novoIdMov(), ativo: alvo.id, tipo: 'saldo-inicial', data: hojeIso(), valor: saldo });
        gravar(`cria investimento ${nome}` + (saldo>0 ? ` com ${brl(saldo)} já guardados` : ''));
      }
      aposMexerNaCarteira();
      return null;
    },
    excluir: a ? ()=>{
      const cart = carteiraEditavel();
      const n = cart.movimentos.filter(m=>m.ativo===id).length;
      const pergunta = n
        ? `Excluir "${a.nome}" e ${n===1?'o movimento':`os ${n} movimentos`} dele?\n\nIsso apaga o histórico de aportes e rendimentos. Se você só parou de usar, marque como encerrado.`
        : `Excluir "${a.nome}"?`;
      if(!confirm(pergunta)) return false;
      cart.ativos = cart.ativos.filter(x=>x.id!==id);
      cart.movimentos = cart.movimentos.filter(m=>m.ativo!==id);
      gravar(`remove investimento ${a.nome}`);
      aposMexerNaCarteira();
      return null;
    } : null,
  });
}

/* ---------- registrar / corrigir um movimento ---------- */
const DICA_MOV = {
  aporte: 'Dinheiro novo que saiu da sua conta e entrou neste investimento.',
  resgate: 'Dinheiro que saiu do investimento e voltou para a sua conta.',
  rendimento: 'Quanto o investimento rendeu. Se você não sabe o valor exato, use "Conferir saldo".',
  conferir: 'Digite o saldo que aparece no banco. A diferença para o saldo daqui é registrada como rendimento, e os dois passam a bater.',
  'saldo-inicial': 'Dinheiro que já estava guardado quando você começou a controlar por aqui. Não é descontado do saldo do mês.',
};
function formMovimento(ativoId, modo, movId){
  const cart0 = DADOS.carteira || { ativos: [], movimentos: [] };
  const existente = movId ? (cart0.movimentos || []).find(m=>m.id===movId) : null;
  if(movId && !existente) return;
  if(existente){ ativoId = existente.ativo; modo = existente.tipo; }
  const ativo = (cart0.ativos || []).find(x=>x.id===ativoId);
  if(!ativo) return;
  const ROTULO = { aporte:'Aporte', resgate:'Resgate', rendimento:'Rendimento', conferir:'Conferir saldo' };
  const modos = existente ? (existente.tipo==='saldo-inicial' ? [] : ['aporte','resgate','rendimento']) : ['aporte','resgate','rendimento','conferir'];
  let modoAtual = modo;

  abrirSheet({
    titulo: ativo.nome,
    corpo: `
      ${modos.length ? `<div class="seg n${modos.length}" id="fm-seg">${modos.map(x=>`<button type="button" data-modo="${x}">${ROTULO[x]}</button>`).join('')}</div>` : ''}
      <p class="sheet-dica" id="fm-dica"></p>
      <div class="campo-linha">
        <label class="campo"><span id="fm-rot">Valor</span><input id="fm-valor" class="num" inputmode="decimal" placeholder="R$ 0,00" data-foco value="${existente ? fmt(Math.abs(existente.valor)) : ''}"></label>
        <label class="campo"><span>Data</span><input id="fm-data" type="date" max="${hojeIso()}" value="${existente ? esc(existente.data) : hojeIso()}"></label>
      </div>
      <label class="check-linha" id="fm-perda-l" hidden><input type="checkbox" id="fm-perda" ${existente && existente.tipo==='rendimento' && existente.valor<0 ? 'checked' : ''}> Foi uma perda (rendimento negativo)</label>
      <div class="sheet-previa" id="fm-previa" hidden></div>
      <label class="campo"><span>Anotação <em>(opcional)</em></span><input id="fm-obs" maxlength="120" placeholder="Ex.: sobra de novembro" value="${esc(existente && existente.obs ? existente.obs : '')}"></label>`,
    salvar: ()=>{
      const data = document.getElementById('fm-data').value;
      if(!Motor.dataValida(data)) return 'Escolha a data.';
      if(data > hojeIso()) return 'A data não pode ser no futuro.';
      let valor = parseValor(document.getElementById('fm-valor').value);
      if(isNaN(valor)) return modoAtual==='conferir' ? 'Digite o saldo que aparece no banco.' : 'Digite o valor.';
      if(modoAtual==='conferir' && valor<0) return 'O saldo no banco não pode ser negativo.';
      valor = reais2(Math.abs(valor));
      const cart = carteiraEditavel();
      const at = cart.ativos.find(x=>x.id===ativoId);
      if(!at) return 'Este investimento não existe mais (foi removido em outro lugar).';
      const obs = document.getElementById('fm-obs').value.trim();
      let tipo = modoAtual, registro = valor, obsFinal = obs, descricao;
      if(modoAtual==='conferir'){
        const diff = reais2(valor - saldoEm(ativoId, data));
        if(diff===0) return 'O saldo já está batendo com o daqui. Nada a registrar.';
        tipo = 'rendimento'; registro = diff;
        obsFinal = `saldo conferido: ${brl(valor)}` + (obs ? ` · ${obs}` : '');
        descricao = `rendimento de ${comSinal(diff)} em ${at.nome} (saldo conferido ${brl(valor)} em ${dataBr(data)})`;
      } else {
        if(valor<=0) return 'O valor precisa ser maior que zero.';
        if(tipo==='rendimento' && document.getElementById('fm-perda').checked) registro = -valor;
        const oQue = tipo==='saldo-inicial' ? `saldo que já existia (${brl(valor)})` : (tipo==='rendimento' ? `rendimento de ${comSinal(registro)}` : `${NOME_MOV[tipo].toLowerCase()} de ${brl(valor)}`);
        descricao = `${existente ? 'corrige ' : ''}${oQue} em ${at.nome} (${dataBr(data)})`;
      }
      const novo = Object.assign({ id: existente ? existente.id : novoIdMov(), ativo: ativoId, tipo, data, valor: registro }, obsFinal ? { obs: obsFinal } : {});
      const lista = existente ? cart.movimentos.map(m=> m.id===movId ? novo : m) : cart.movimentos.concat([novo]);
      if(existente && !cart.movimentos.some(m=>m.id===movId)) return 'Este movimento não existe mais (foi removido em outro lugar).';
      const neg = ficariaNegativo(ativoId, lista);
      if(neg) return `Com isso o saldo ficaria negativo em ${dataBr(neg.data)} (${brl(neg.saldoApos)}). Confira o valor e a data.`;
      cart.movimentos = lista;
      gravar(descricao);
      aposMexerNaCarteira();
      return null;
    },
    excluir: existente ? ()=>{
      const cart = carteiraEditavel();
      const lista = cart.movimentos.filter(m=>m.id!==movId);
      const neg = ficariaNegativo(ativoId, lista);
      if(neg) return `Sem este movimento o saldo ficaria negativo em ${dataBr(neg.data)}. Corrija os movimentos seguintes antes.`;
      if(!confirm(`Excluir ${NOME_MOV[existente.tipo].toLowerCase()} de ${brl(Math.abs(existente.valor))} em ${dataBr(existente.data)}?`)) return false;
      cart.movimentos = lista;
      gravar(`remove ${NOME_MOV[existente.tipo].toLowerCase()} de ${brl(Math.abs(existente.valor))} em ${ativo.nome} (${dataBr(existente.data)})`);
      aposMexerNaCarteira();
      return null;
    } : null,
  });

  const el = (k)=>document.getElementById(k);
  const atualizar = ()=>{
    el('fm-dica').textContent = DICA_MOV[modoAtual];
    el('fm-rot').textContent = modoAtual==='conferir' ? 'Saldo no banco' : 'Valor';
    el('fm-perda-l').hidden = modoAtual!=='rendimento';
    el('sheetOk').textContent = modoAtual==='conferir' ? 'Registrar' : 'Salvar';
    if(el('fm-seg')) el('fm-seg').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.modo===modoAtual));
    const previa = el('fm-previa');
    previa.hidden = modoAtual!=='conferir';
    if(modoAtual==='conferir'){
      const data = el('fm-data').value;
      if(!Motor.dataValida(data)){ previa.textContent = 'Escolha a data.'; return; }
      const aqui = saldoEm(ativoId, data);
      const informado = parseValor(el('fm-valor').value);
      let txt = `Saldo daqui em ${dataBr(data)}: <b>${brl(aqui)}</b>.`;
      if(!isNaN(informado) && informado>=0){
        const diff = reais2(informado - aqui);
        txt += diff===0 ? ' Já está batendo: nada a registrar.' : ` Diferença de <b>${comSinal(diff)}</b>, que entra como ${diff>0?'rendimento':'perda'}.`;
      }
      previa.innerHTML = txt;
    }
  };
  if(el('fm-seg')) el('fm-seg').addEventListener('click', (ev)=>{
    const b = ev.target.closest('button[data-modo]');
    if(!b) return;
    modoAtual = b.dataset.modo;
    el('sheetErro').textContent = '';
    atualizar();
    el('fm-valor').focus();
  });
  el('fm-valor').addEventListener('input', atualizar);
  el('fm-data').addEventListener('input', atualizar);
  atualizar();
}

/* =========================================================================
   BOOT
   ========================================================================= */
function renderAtual(){
  renderConfirmar();
  const iHoje = idxDeHoje();
  document.getElementById('mesHoje').hidden = (iHoje<0 || iHoje===mesAtualIdx);
}


/* =========================================================================
   DADOS NA TELA — recebe o conteúdo do financas.json e (re)monta tudo.
   Roda na abertura e sempre que o repositório mudou por fora (o chat gravou).
   ========================================================================= */
let __renderAdiado = false;
function aplicarDados(d){
  const mesAberto = months[mesAtualIdx];
  DADOS = d;
  M = Motor.criar(DADOS);
  months = M.months; data = M.data; monthStats = M.monthStats; investimentos = M.investimentos;
  ESTADO = DADOS.estado;
  viagemCustos = DADOS.viagem.custos;
  viagemDesafio = DADOS.viagem.desafio40k;
  if(viagemDesafio.cdiAnualPercent===undefined) viagemDesafio.cdiAnualPercent = viagemDesafio.cdiAnualPercentPadrao || 14.15;
  // mantém o mês que estava aberto; na primeira vez, abre no mês de hoje
  let idx = mesAberto ? months.indexOf(mesAberto) : -1;
  if(idx<0){ const h = new Date(); idx = months.indexOf(Motor.mesLabel(h.getFullYear()*12 + h.getMonth())); }
  mesAtualIdx = idx>=0 ? idx : 0;
  // quem está digitando num campo não perde o foco: a tela é refeita quando sair do campo
  const el = document.activeElement;
  if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA') && !el.closest('#portao')){ __renderAdiado = true; return; }
  renderTudo();
}
function renderTudo(){
  __renderAdiado = false;
  montarSeletorMeses();
  renderAtual();
  simulacaoRenderizada = false; viagemRenderizada = false; anoAberto = null;
  Object.keys(__porAnoCache).forEach(k=>delete __porAnoCache[k]);
  const ativa = document.querySelector('.view.active');
  if(ativa && ativa.id==='view-investimentos') renderInvestimentos();
  if(ativa && ativa.id==='view-assinaturas') renderAssinaturas();
  if(ativa && ativa.id==='view-simulacao'){ renderSimulacao(); renderAnoDetalhe(); }
  if(ativa && ativa.id==='view-viagem') renderViagemIfNeeded();
}
document.addEventListener('focusout', ()=>{ if(__renderAdiado) setTimeout(()=>{ if(__renderAdiado) renderTudo(); }, 50); });

/* ---------- aviso de gravação ---------- */
let __statusT = null;
function mostrarStatus(status, detalhe){
  const pill = document.getElementById('statusSync');
  const ind = document.getElementById('saveIndicator');
  const textos = {
    pendente: 'alteração pendente…', salvando: 'salvando…', salvo: 'salvo no repositório',
    atualizado: 'atualizado com o que mudou no repositório',
    offline: 'sem conexão · mostrando a última versão', local: 'prévia local · nada é gravado',
    erro: 'não salvou: ' + ((detalhe && detalhe.message) || 'erro') + ' · toque para tentar de novo',
  };
  const txt = textos[status] || '';
  pill.textContent = txt;
  pill.className = 'status-sync visivel' + (status==='erro' ? ' erro' : '');
  if(ind) ind.textContent = (status==='salvo' || status==='atualizado') ? '' : txt;
  clearTimeout(__statusT);
  if(status==='salvo' || status==='atualizado' || status==='local') __statusT = setTimeout(()=>pill.classList.remove('visivel'), 1800);
  if(status==='erro' && detalhe && detalhe.tipo==='chave') pedirChave('A chave de acesso deixou de funcionar (venceu ou foi apagada). Cole uma nova para continuar — o que você alterou está guardado e será enviado.');
}
document.getElementById('statusSync').addEventListener('click', ()=>{ if(SYNC) SYNC.salvarAgora(); });

/* ---------- tela de entrada ---------- */
const CHAVE_LS = 'vf:chave';
function portao(estado, texto, erro){
  const p = document.getElementById('portao');
  p.hidden = (estado==='fechado');
  document.getElementById('portaoTexto').textContent = texto || '';
  document.getElementById('portaoErro').textContent = erro || '';
  const pedindo = (estado==='chave');
  document.getElementById('portaoChave').hidden = !pedindo;
  const btn = document.getElementById('portaoBtn');
  btn.hidden = !(pedindo || estado==='erro');
  btn.disabled = false;
  btn.textContent = pedindo ? 'Entrar' : 'Tentar de novo';
  if(pedindo) document.getElementById('portaoChave').focus();
}
function pedirChave(erro){
  portao('chave', 'Cole a chave de acesso deste aparelho. Ela fica guardada só neste navegador e não é pedida de novo.', erro);
}
document.getElementById('portaoForm').addEventListener('submit', (ev)=>{
  ev.preventDefault();
  const campo = document.getElementById('portaoChave');
  if(!campo.hidden){
    const chave = campo.value.trim();
    if(!chave) return;
    try{ localStorage.setItem(CHAVE_LS, chave); }catch(e){}
    campo.value = '';
  }
  iniciar();
});
function sairDesteAparelho(){
  if(SYNC && SYNC.pendente && !confirm('Há alterações ainda não gravadas. Sair mesmo assim?')) return;
  if(SYNC) SYNC.esquecer();
  try{ localStorage.removeItem(CHAVE_LS); }catch(e){}
  location.reload();
}

function conferirDados(d){
  const erros = Motor.validar(d).filter(p=>p.nivel==='erro').map(p=>'• '+p.msg);
  if(erros.length) throw Object.assign(new Error('dados'), { tipo:'dados', lista: erros });
}

/* ---------- abertura ---------- */
async function iniciar(){
  portao('carregando', 'Carregando seus dados…');
  try{
    if(MODO_LOCAL){
      const r = await fetch(ARQUIVO_DADOS, { cache:'no-store' });
      if(!r.ok) throw new Error('Não achei '+ARQUIVO_DADOS+' nesta pasta.');
      const d = await r.json();
      conferirDados(d);
      aplicarDados(d);
      document.getElementById('syncNote').textContent = 'Prévia local: lendo data/financas.json desta pasta. Nada é gravado.';
      portao('fechado');
      return;
    }
    let chave = null;
    try{ chave = localStorage.getItem(CHAVE_LS); }catch(e){}
    if(!chave){ pedirChave(); return; }
    SYNC = Sync.criar({
      repo: REPO, arquivo: ARQUIVO_DADOS, ramo: 'main', token: chave,
      ler: (k)=>localStorage.getItem(k),
      guardar: (k,v)=>{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); },
      aoStatus: mostrarStatus,
      aoDados: (d)=>{ try{ conferirDados(d); aplicarDados(d); }catch(e){ mostrarStatus('erro', new Error('os dados no repositório estão com problema')); } },
    });
    const d = await SYNC.carregar();
    conferirDados(d);
    aplicarDados(d);
    document.getElementById('syncNote').innerHTML = 'Sincronizado com o repositório privado. <a onclick="sairDesteAparelho()">Sair deste aparelho</a>';
    portao('fechado');
  }catch(e){
    SYNC = null;
    if(e.tipo==='chave' || e.tipo==='acesso'){
      try{ localStorage.removeItem(CHAVE_LS); }catch(_){}
      pedirChave(e.message);
    } else if(e.tipo==='dados'){
      portao('erro', 'Os dados no repositório estão com um problema e o app não consegue abrir. Peça ao chat para corrigir e tente de novo.', (e.lista||[e.message]).slice(0,8).join('\n'));
    } else {
      portao('erro', 'Não consegui carregar seus dados.', e.message || String(e));
    }
  }
}

// Voltou pro app (trocou de aba, desbloqueou o celular)? Confere se o chat gravou algo novo.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && SYNC) SYNC.conferir(); });
// Fechando com alteração ainda não enviada: tenta gravar já (o que não for, fica guardado e vai na próxima abertura).
window.addEventListener('pagehide', ()=>{ if(SYNC && SYNC.pendente) SYNC.salvarAgora(); });

iniciar();
</script>
